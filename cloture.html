<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HP | Clôture & réévaluation</title>
<style>
:root{font-family:Inter,Arial,sans-serif;background:#f6f6f2;color:#193b32;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}.top{background:#103d32;color:#fff;padding:18px max(20px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;align-items:center;gap:14px}.top b{font:700 24px Georgia,serif}.top small{display:block;opacity:.75;font-size:12px;margin-top:4px}.top a{background:#fff;color:#103d32;text-decoration:none;border-radius:8px;padding:10px 13px;font-weight:750}.wrap{max-width:1120px;margin:28px auto 65px;padding:0 20px}h1,h2,h3{font-family:Georgia,serif}h1{font-size:34px;margin:5px 0 8px}h2{font-size:23px;margin:0 0 11px}h3{font-size:17px;margin:0 0 6px}p{line-height:1.55}.muted{color:#69766e;font-size:12px}.tag{display:inline-flex;padding:6px 10px;border-radius:99px;background:#e8eee9;color:#28584a;font-size:11px;font-weight:800}.lead{display:flex;justify-content:space-between;align-items:start;gap:20px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin:20px 0}.card,.panel,.gate{background:#fff;border:1px solid #e1e6e0;border-radius:13px}.card{padding:16px}.card strong{display:block;font:700 28px Georgia,serif;margin:8px 0 3px}.panel{padding:22px;margin:19px 0}.notice{border-left:3px solid #b28a39;background:#fcf8ed;color:#725a27;padding:13px 15px;line-height:1.5;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.gateGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.gate{padding:14px}.gate b{display:block;margin-bottom:4px}.ok{color:#246944}.warn{color:#8a6417}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d9e1d9;border-radius:8px;background:#fff;color:#193b32}.field textarea{min-height:110px;resize:vertical;line-height:1.5}.wide{grid-column:1/-1}.btn{border:0;border-radius:8px;background:#103d32;color:#fff;padding:11px 17px;font-weight:750;cursor:pointer}.btn.secondary{background:#edf2ed;color:#204b3b}.btn:disabled{opacity:.55}.footer{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;border-top:1px solid #e5eae4;padding-top:16px;margin-top:16px}.error{color:#a93f39}.empty{padding:25px;color:#6a766e}.decisionHint{margin-top:8px;padding:10px 12px;background:#f4f7f3;border-radius:8px;font-size:12px;color:#596a60}.history{border-top:1px solid #e5eae4;padding:11px 0}.history:first-child{border-top:0}@media(max-width:720px){.lead{display:block}.cards{grid-template-columns:1fr 1fr}.grid,.gateGrid{grid-template-columns:1fr}.wide{grid-column:auto}.panel{padding:15px}h1{font-size:28px}}@media print{.top,.noprint,button{display:none!important}.wrap{max-width:none;margin:0;padding:0}.panel,.card,.gate{break-inside:avoid}.field input,.field textarea,.field select{border:0;padding:2px 0;min-height:0}@page{size:A4 portrait;margin:14mm}}
</style></head><body>
<header class="top"><div><b>HP</b><small>Hospitality Performance · Clôture & réévaluation</small></div><a id="back" href="post_bilan.html">Retour au suivi post-intervention</a></header>
<main class="wrap" id="app"><div class="empty">Chargement de la clôture…</div></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.116.0';
const sb=createClient('https://wztiaiwjprarpdzsudpx.supabase.co','sb_publishable_JqSGi4QEil2MBaI5tYsQvA_wQnxz8U_');
const q=new URLSearchParams(location.search),app=document.getElementById('app');let proposalId=q.get('proposal')||'',proposal=null,review=null,checks=[],steps=[],tracked=[],score=null,closure=null,metrics=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dated=v=>v?new Date(String(v).slice(0,10)+'T12:00:00').toLocaleDateString('fr-FR'):'—';
const num=v=>v===null||v===undefined||v===''?'—':Number(v).toLocaleString('fr-FR',{maximumFractionDigits:2});
function action(s){return tracked.find(x=>x.proposal_item_id===s.proposal_item_id&&x.step_order===s.step_order)||{status:'À faire'}}
function render(){const total=steps.length,done=steps.filter(x=>action(x).status==='Terminé').length,open=total-done,realized=checks.filter(x=>x.status==='Réalisé').length,usableMetrics=metrics.filter(x=>x.comparable&&x.baseline_value!==null&&x.latest_value!==null&&x.baseline_snapshot_id!==x.latest_snapshot_id).length;const c=closure||{};const gates=[['Bilan validé',review?.assessment_status==='Validé',review?.assessment_status||'Absent'],['Contrôles post-intervention',realized===3,realized+'/3 réalisés'],['Actions initiales clôturées',open===0,done+'/'+total+' terminées'],['Comparatif HP disponible',!!score?.latest_snapshot_id,score?num(score.latest_hp_score)+'/100':'Absent']];
app.innerHTML=`<section class="lead"><div><span class="tag">Décision finale du consultant</span><h1>Clôture & réévaluation</h1><p>${esc(proposal.establishment_name)} · ${esc(proposal.proposal_name)}</p></div><span class="tag">${esc(c.decision||'Brouillon')}</span></section>
<section class="cards"><article class="card"><small>Actions terminées</small><strong>${done}/${total}</strong></article><article class="card"><small>Contrôles réalisés</small><strong>${realized}/3</strong></article><article class="card"><small>HP Score actuel</small><strong>${score?num(score.latest_hp_score):'—'}</strong></article><article class="card"><small>KPI comparables</small><strong>${usableMetrics}</strong></article></section>
<div class="notice">La clôture ne modifie ni le HP Score, ni les données économiques, ni le statut commercial de la proposition. Elle documente uniquement la décision du consultant à partir des éléments disponibles.</div>
<section class="panel"><h2>1. Préparation à la clôture</h2><div class="gateGrid">${gates.map(g=>`<article class="gate"><b class="${g[1]?'ok':'warn'}">${g[1]?'✓':'△'} ${esc(g[0])}</b><span class="muted">${esc(g[2])}</span></article>`).join('')}</div>${gates.every(x=>x[1])?'<p class="muted">Tous les points de préparation sont documentés.</p>':'<p class="muted">La décision reste possible, mais les éléments incomplets doivent être explicités dans la conclusion.</p>'}</section>
<section class="panel"><h2>2. Synthèse des contrôles post-intervention</h2>${[30,60,90].map(day=>{const x=checks.find(c=>c.checkpoint_day===day);return `<div class="history"><b>J+${day} · ${esc(x?.status||'Non renseigné')}</b><div class="muted">Échéance : ${dated(x?.planned_date)} · Constat : ${dated(x?.observed_date)}</div>${x?.observation?`<p>${esc(x.observation)}</p>`:''}${x?.next_decision?`<p><b>Décision :</b> ${esc(x.next_decision)}</p>`:''}</div>`}).join('')}</section>
<section class="panel"><h2>3. Décision de clôture</h2><div class="grid"><div class="field"><label>Date de clôture / décision</label><input id="closureDate" type="date" value="${esc(c.closure_date||'')}"></div><div class="field"><label>Décision</label><select id="decision">${['Brouillon','Sous observation','Clôturé','Prolongation ciblée','Nouveau diagnostic'].map(x=>`<option ${c.decision===x?'selected':''}>${x}</option>`).join('')}</select><div class="decisionHint" id="hint"></div></div><div class="field"><label>Résultats stabilisés</label><textarea id="sustained" maxlength="5000" placeholder="Pratiques ou résultats maintenus, avec références de preuves si disponibles.">${esc(c.sustained_results||'')}</textarea></div><div class="field"><label>Risques et points restant ouverts</label><textarea id="risks" maxlength="5000" placeholder="Points fragiles, données manquantes, sujets non résolus…">${esc(c.remaining_risks||'')}</textarea></div><div class="field"><label>Enseignements de la mission</label><textarea id="lessons" maxlength="5000" placeholder="Ce qui a fonctionné, limites rencontrées, conditions de réussite…">${esc(c.lessons_learned||'')}</textarea></div><div class="field"><label>Suivi recommandé</label><textarea id="follow" maxlength="5000" placeholder="Rythme de contrôle, indicateurs à suivre, responsable interne…">${esc(c.recommended_follow_up||'')}</textarea></div><div class="field"><label>Prochaine revue recommandée</label><input id="nextReview" type="date" value="${esc(c.next_review_date||'')}"></div><div class="field wide"><label>Conclusion de clôture</label><textarea id="conclusion" maxlength="6000" placeholder="Justifier la décision, distinguer les résultats démontrés, les progrès observés et les éléments encore non vérifiés.">${esc(c.closure_conclusion||'')}</textarea></div></div><div class="footer"><span id="saveInfo" class="muted">${c.updated_at?'Dernier enregistrement : '+new Date(c.updated_at).toLocaleString('fr-FR'):'Aucune décision enregistrée'}</span><div class="noprint"><button class="btn secondary" id="print">Imprimer / PDF</button> <button class="btn" id="save">Enregistrer la décision</button></div></div></section>`;
const decision=document.getElementById('decision'),hint=document.getElementById('hint');function setHint(){const map={'Brouillon':'Décision non finalisée.','Sous observation':'Poursuivre le contrôle sans rouvrir une mission.','Clôturé':'Accompagnement terminé ; conserver uniquement le suivi recommandé.','Prolongation ciblée':'Une ou plusieurs actions nécessitent une intervention complémentaire.','Nouveau diagnostic':'Lancer ultérieurement un nouveau diagnostic HP indépendant de celui-ci.'};hint.textContent=map[decision.value]||''}decision.onchange=setHint;setHint();document.getElementById('save').onclick=save;document.getElementById('print').onclick=()=>window.print();}
async function save(){const g=id=>document.getElementById(id).value.trim(),button=document.getElementById('save'),info=document.getElementById('saveInfo');const payload={proposal_id:proposalId,closure_date:g('closureDate')||null,decision:g('decision'),sustained_results:g('sustained'),remaining_risks:g('risks'),lessons_learned:g('lessons'),recommended_follow_up:g('follow'),next_review_date:g('nextReview')||null,closure_conclusion:g('conclusion'),updated_at:new Date().toISOString()};if(payload.decision!=='Brouillon'&&(!payload.closure_date||!payload.closure_conclusion)){info.className='error';info.textContent='Pour finaliser une décision, renseigner une date et une conclusion.';return;}const realized=checks.filter(x=>x.status==='Réalisé').length,open=steps.filter(x=>action(x).status!=='Terminé').length;if(payload.decision==='Clôturé'&&(realized<3||open>0||review?.assessment_status!=='Validé')&&payload.closure_conclusion.length<80){info.className='error';info.textContent='La clôture comporte des éléments incomplets : documente la justification dans la conclusion.';return;}button.disabled=true;info.className='muted';info.textContent='Enregistrement…';try{const {data,error}=await sb.from('hp_intervention_closures').upsert(payload,{onConflict:'proposal_id'}).select('*').single();if(error)throw error;closure=data;render();document.getElementById('saveInfo').textContent='Enregistré · '+new Date(data.updated_at).toLocaleString('fr-FR');}catch(e){info.className='error';info.textContent='Échec : '+e.message;button.disabled=false}}
async function chooser(){const {data,error}=await sb.from('hp_proposals').select('id,proposal_name,status,created_at').order('created_at',{ascending:false}).limit(100);if(error)throw error;app.innerHTML=`<section class="panel"><h1>Choisir un accompagnement</h1><p class="muted">La clôture est rattachée à une proposition enregistrée.</p><div class="field"><label>Proposition</label><select id="choice"><option value="">Sélectionner…</option>${(data||[]).map(x=>`<option value="${esc(x.id)}">${esc(x.proposal_name)} · ${esc(x.status)} · ${new Date(x.created_at).toLocaleDateString('fr-FR')}</option>`).join('')}</select></div><button class="btn" id="open">Ouvrir</button></section>`;document.getElementById('open').onclick=()=>{const id=document.getElementById('choice').value;if(id)location.href='cloture.html?proposal='+encodeURIComponent(id)}}
async function load(){const {data:{session},error:ae}=await sb.auth.getSession();if(ae)throw ae;if(!session){app.innerHTML='<section class="panel error">Connexion requise.</section>';return;}if(!proposalId){await chooser();return;}document.getElementById('back').href='post_bilan.html?proposal='+encodeURIComponent(proposalId);const [p,h,r,c,st,it,sco,met]=await Promise.all([sb.from('hp_proposals').select('id,diagnostic_id,proposal_name,status').eq('id',proposalId).single(),sb.from('hp_consultant_mission_v1').select('establishment_name').eq('proposal_id',proposalId).limit(1),sb.from('hp_intervention_reviews').select('*').eq('proposal_id',proposalId).maybeSingle(),sb.from('hp_post_intervention_checkpoints').select('*').eq('proposal_id',proposalId),sb.from('hp_proposal_action_plan_v1').select('proposal_item_id,step_order').eq('proposal_id',proposalId),sb.from('hp_proposal_items').select('id').eq('proposal_id',proposalId),sb.from('hp_score_impact_v1').select('*').eq('diagnostic_id',(await sb.from('hp_proposals').select('diagnostic_id').eq('id',proposalId).single()).data?.diagnostic_id).maybeSingle(),sb.from('hp_economic_impact_v1').select('*').eq('diagnostic_id',(await sb.from('hp_proposals').select('diagnostic_id').eq('id',proposalId).single()).data?.diagnostic_id)]);for(const x of [p,h,r,c,st,it,sco,met])if(x.error)throw x.error;proposal={...p.data,establishment_name:h.data?.[0]?.establishment_name||'Établissement'};review=r.data||null;checks=c.data||[];steps=st.data||[];score=sco.data||null;metrics=met.data||[];const ids=(it.data||[]).map(x=>x.id);const [t,cl]=await Promise.all([ids.length?sb.from('hp_mission_step_tracking').select('proposal_item_id,step_order,status').in('proposal_item_id',ids):Promise.resolve({data:[],error:null}),sb.from('hp_intervention_closures').select('*').eq('proposal_id',proposalId).maybeSingle()]);if(t.error)throw t.error;if(cl.error)throw cl.error;tracked=t.data||[];closure=cl.data||null;render()}
load().catch(e=>{console.error(e);app.innerHTML='<section class="panel error">Erreur de chargement : '+esc(e.message)+'</section>'});
</script></body></html>
