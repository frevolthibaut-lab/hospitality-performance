<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HP | Historique documentaire</title><style>
:root{font-family:Inter,Arial,sans-serif;color:#213a30;background:#f7f6f2;font-size:14px}*{box-sizing:border-box}body{margin:0}.top{background:#103d32;color:#fff;padding:20px max(20px,calc((100vw - 1160px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px}.top b{font:700 25px Georgia,serif}.top small{display:block;opacity:.75;margin-top:4px}.top a{background:#fff;color:#103d32;border-radius:8px;padding:10px 14px;text-decoration:none;font-weight:800}.wrap{max-width:1160px;margin:30px auto 65px;padding:0 20px}h1,h2{font-family:Georgia,serif}h1{font-size:34px;margin:0 0 8px}h2{font-size:23px;margin:0 0 12px}.intro{color:#64766b;line-height:1.55}.box,.metric{background:white;border:1px solid #e1e6df;border-radius:13px;padding:21px;margin:18px 0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.summary article{background:#fff;border:1px solid #e1e6df;border-radius:11px;padding:16px}.summary b{display:block;font-size:26px;font-family:Georgia,serif;margin:6px 0}.summary small{color:#64766b}.tag{font-size:11px;font-weight:750;display:inline-block;border-radius:99px;background:#e9f1eb;color:#265b43;padding:5px 9px}.tag.warn{background:#fff3d9;color:#835c1b}.note{background:#f5f8f3;border-left:3px solid #6b987a;padding:13px 16px;line-height:1.55;color:#4a6555}.warnbox{background:#fff9eb;border-left:3px solid #b88b36;padding:12px 15px;line-height:1.5;color:#765a26}.metric h3{font-size:17px;margin:0 0 8px}.meta{font-size:12px;color:#627468;margin:5px 0 12px}.series{display:grid;gap:12px}.point{display:grid;grid-template-columns:110px 1fr 170px;gap:14px;align-items:center}.track{height:12px;background:#edf2eb;border-radius:20px;overflow:hidden}.fill{height:100%;border-radius:20px;background:#2e7157}.point b{text-align:right;font-variant-numeric:tabular-nums}.point small{color:#65766d}table{border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid #e7eae5;vertical-align:top}th{font-size:11px;color:#64746a;background:#f5f7f4}.empty{padding:18px;color:#718078}.foot{font-size:12px;color:#6e7a72;margin-top:18px}a{color:#28654c}@media(max-width:750px){.summary{grid-template-columns:1fr}.point{grid-template-columns:72px 1fr;gap:8px}.point b{grid-column:2;text-align:left}.top{display:block}.top a{display:inline-block;margin-top:12px}table{display:block;overflow:auto}}
</style></head><body><header class="top"><div><b>HP</b><small>Hospitality Performance · Analyse historique</small></div><a id="back" href="documents.html">Retour aux documents</a></header><main class="wrap" id="app"><div class="empty">Chargement de l'historique…</div></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.116.0';
const sb=createClient('https://wztiaiwjprarpdzsudpx.supabase.co','sb_publishable_JqSGi4QEil2MBaI5tYsQvA_wQnxz8U_');const app=document.getElementById('app');const q=new URLSearchParams(location.search);const id=q.get('diagnostic')||localStorage.getItem('hp_selected_diagnostic');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=x=>Number(x).toLocaleString('fr-FR',{maximumFractionDigits:2});const date=x=>x?new Date(x+'T12:00:00').toLocaleDateString('fr-FR'):'—';const period=h=>`${date(h.period_start)} → ${date(h.period_end)}`;const days=h=>h.period_start&&h.period_end?(Date.parse(h.period_end)-Date.parse(h.period_start))/86400000+1:0;
function metricPanel(code,rows,catalog){const data=rows.filter(x=>x.review_status==='valide_historique'&&x.metric_value!==null&&x.period_start&&x.period_end).sort((a,b)=>a.period_end.localeCompare(b.period_end));const name=catalog[code]?.label||code,unit=catalog[code]?.unit||'',max=Math.max(...data.map(x=>Math.abs(Number(x.metric_value))),1);const bases=new Set(data.map(x=>x.amount_basis||'sans objet'));const lens=data.map(days);const comparable=data.length>=2&&bases.size===1&&lens.every(v=>v>0)&&Math.max(...lens)/Math.min(...lens)<=1.15;const last=data.at(-1),prev=data.at(-2);const delta=comparable&&prev&&Number(prev.metric_value)!==0?(Number(last.metric_value)-Number(prev.metric_value))/Math.abs(Number(prev.metric_value))*100:null;return `<section class="metric"><h3>${esc(name)}</h3><div class="meta">${esc(unit)} · ${data.length} période(s) vérifiée(s) · ${comparable?'Périodes de durées proches / base homogène':'Comparaison non autorisée sans vérifier les périodes et les bases'}</div><div class="series">${data.map(x=>`<div class="point"><small>${esc(String(x.period_end).slice(0,4))}<br>${esc(period(x))}</small><div class="track"><div class="fill" style="width:${100*Math.abs(Number(x.metric_value))/max}%"></div></div><b>${fmt(x.metric_value)} ${esc(unit)}</b></div>`).join('')}</div>${delta!==null?`<p class="note" style="margin-top:14px">Variation descriptive entre les deux dernières périodes : ${delta>=0?'+':''}${fmt(delta)} %. À interpréter en tenant compte du périmètre, de la saisonnalité et des autres facteurs.</p>`:'<p class="warnbox" style="margin-top:14px">Comparaison insuffisante : HP n’en déduit aucune amélioration ou dégradation.</p>'}</section>`;}
async function load(){if(!id){app.innerHTML='<div class="empty">Sélectionnez un établissement depuis l’Administration.</div>';return;}document.getElementById('back').href=`documents.html?diagnostic=${encodeURIComponent(id)}`;const {data:{session}}=await sb.auth.getSession();if(!session){app.innerHTML='<div class="empty">Connexion à l’Administration requise.</div>';return;}const [di,ref,doc,history,catalog]=await Promise.all([sb.from('hp_diagnostics').select('establishment_name').eq('id',id).single(),sb.from('hp_diagnostic_reference_periods').select('period_start,period_end').eq('diagnostic_id',id).single(),sb.from('hp_documents').select('id,original_name,period_start,period_end,extraction_status').eq('diagnostic_id',id).order('period_end'),sb.from('hp_document_metric_history').select('extraction_id,document_id,metric_code,metric_value,period_start,period_end,amount_basis,review_status,review_note').eq('diagnostic_id',id).order('period_end'),sb.from('hp_economic_metric_catalog').select('metric_code,label,unit').eq('active',true)]);for(const x of [di,ref,doc,history,catalog])if(x.error)throw x.error;const docs=doc.data||[],rows=history.data||[],valid=rows.filter(x=>x.review_status==='valide_historique'&&x.metric_value!==null),pending=rows.filter(x=>x.review_status==='a_verifier'),cat=Object.fromEntries((catalog.data||[]).map(x=>[x.metric_code,x]));const byMetric=new Map();for(const row of valid){if(!byMetric.has(row.metric_code))byMetric.set(row.metric_code,[]);byMetric.get(row.metric_code).push(row);}const active=ref.data;app.innerHTML=`<h1>Historique · ${esc(di.data?.establishment_name||'Établissement')}</h1><p class="intro">Les documents anciens nourrissent la compréhension de l’établissement et les comparaisons chronologiques. Ils ne modifient ni les indicateurs courants ni le HP Score au moment de leur importation.</p><div class="note">Période de référence courante : <b>${esc(period(active))}</b>. Toute source extérieure reste historique, même après validation des montants.</div><div class="summary"><article><small>Documents archivés</small><b>${docs.length}</b></article><article><small>Mesures historiques contrôlées</small><b>${valid.length}</b></article><article><small>Mesures à vérifier</small><b>${pending.length}</b></article></div><section class="box"><h2>Documents par exercice</h2><table><thead><tr><th>Document</th><th>Période</th><th>Usage</th></tr></thead><tbody>${docs.map(d=>`<tr><td>${esc(d.original_name)}</td><td>${esc(period(d))}</td><td>${d.period_start>=active.period_start&&d.period_end<=active.period_end?'<span class="tag">Période courante</span>':'<span class="tag warn">Référence historique</span>'}</td></tr>`).join('')}</tbody></table></section><section class="box"><h2>Tendances documentées</h2><p class="intro">Les graphiques n'utilisent que les montants explicitement vérifiés. Les périodes ou bases hétérogènes ne sont pas présentées comme comparables.</p>${byMetric.size?[...byMetric].sort((a,b)=>a[0].localeCompare(b[0])).map(([code,list])=>metricPanel(code,list,cat)).join(''):'<div class="empty">Aucune série validée pour le moment. Les documents restent disponibles pour contrôle.</div>'}</section><section class="box"><h2>Points à approfondir</h2>${pending.length?`<p class="warnbox">${pending.length} extraction(s) attendent une vérification comptable et sont exclues des graphiques et des conclusions.</p><table><thead><tr><th>Indicateur</th><th>Période</th><th>Raison</th></tr></thead><tbody>${pending.map(x=>`<tr><td>${esc(cat[x.metric_code]?.label||x.metric_code)}</td><td>${esc(period(x))}</td><td>${esc(x.review_note||'Montant non vérifié')}</td></tr>`).join('')}</tbody></table>`:'<p class="note">Aucune extraction en attente de contrôle.</p>'}<p class="foot">Les observations ci-dessus servent à prioriser les vérifications et à préparer l’analyse consultant. Elles ne remplacent pas la validation d’un bilan ou d’un ratio par période homogène.</p></section>`;}
load().catch(e=>{console.error(e);app.innerHTML=`<div class="box" style="color:#a03d33">Historique indisponible : ${esc(e.message)}</div>`});
</script></body></html>
