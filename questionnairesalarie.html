<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Questionnaire salarié · Hospitality Performance</title><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');
:root{--g:#0b3d2e;--soft:#eaf1ed;--paper:#fffefa;--bg:#f6f4ef;--muted:#65726a;--line:#dadfd8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:#1c2720}.wrap{max-width:840px;margin:0 auto;padding:26px 16px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;color:var(--g)}.mark{font:600 42px Playfair Display,Georgia,serif}.top small{font-size:10px;letter-spacing:.16em;text-transform:uppercase}.sheet{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:32px;box-shadow:0 14px 40px #1d33200b}.eyebrow{font-size:10px;color:var(--g);font-weight:700;letter-spacing:.15em;text-transform:uppercase}h1{font:600 clamp(30px,5vw,43px)/1.1 Playfair Display,Georgia,serif;margin:10px 0 14px}p{font-size:13px;line-height:1.65;color:#536159}.note{background:#eef4ef;border-left:3px solid var(--g);padding:13px 15px;margin:22px 0;font-size:12px;line-height:1.6}.note strong{color:var(--g)}.progress{height:5px;background:#e5e9e4;border-radius:20px;overflow:hidden;margin:12px 0 20px}.progress>div{height:100%;background:var(--g);transition:width .2s}.q{border-top:1px solid var(--line);padding:22px 0}.q h3{font-size:14px;line-height:1.45;margin:0 0 13px;font-weight:600}.optional{color:#8a928c;font-size:10px;font-weight:400}.options{display:grid;gap:8px}.option{display:flex;gap:11px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:8px;background:white;font-size:12px;cursor:pointer}.option:has(input:checked){border-color:#2f6d55;background:#edf5ee}.option input{accent-color:var(--g);flex-shrink:0}textarea{width:100%;min-height:105px;padding:12px;border:1px solid var(--line);border-radius:8px;font:12px/1.6 Inter,system-ui;resize:vertical}.actions{display:flex;gap:9px;justify-content:space-between;margin-top:22px}button{border:1px solid var(--g);background:var(--g);color:white;border-radius:7px;padding:12px 20px;font-weight:700;cursor:pointer}button.secondary{background:transparent;color:var(--g)}button:disabled{opacity:.45;cursor:default}.error{color:#a13f35;font-size:12px;margin:12px 0}.footer{font-size:10px;margin-top:16px;color:#7b867f}@media(max-width:600px){.sheet{padding:19px}.wrap{padding:15px 10px 40px}}@media print{.actions{display:none}.sheet{box-shadow:none}}
</style></head><body><main class="wrap"><div class="top"><span class="mark">HP</span><small>Hospitality Performance · Écoute terrain</small></div><section class="sheet" id="app"></section><div class="footer">Prototype de validation : ce formulaire ne transmet ni ne conserve vos réponses sur un serveur.</div></main><script>
const QUESTIONS=[{"section": "profil", "section_title": "Votre activité au quotidien", "prompt": "Dans quel environnement travaillez-vous principalement ?", "type": "single", "options": ["Salle / accueil", "Bar", "Cuisine / production", "Réception / hébergement", "Événementiel", "Administratif / support", "Polyvalent", "Autre / Je préfère ne pas répondre"], "required": false, "id": "emp_01"}, {"section": "profil", "section_title": "Votre activité au quotidien", "prompt": "Depuis combien de temps travaillez-vous dans cet établissement ?", "type": "single", "options": ["Moins de 3 mois", "3 à 12 mois", "1 à 3 ans", "Plus de 3 ans", "Je préfère ne pas répondre"], "required": false, "id": "emp_02"}, {"section": "profil", "section_title": "Votre activité au quotidien", "prompt": "À quels moments intervenez-vous principalement ?", "type": "multiple", "options": ["Préparation / ouverture", "Périodes calmes", "Périodes de forte affluence", "Fermeture", "Horaires variables", "Je préfère ne pas répondre"], "required": false, "id": "emp_03"}, {"section": "terrain", "section_title": "Organisation réelle du travail", "prompt": "Au début de votre service, savez-vous clairement ce qui est attendu de vous ?", "type": "scale", "options": ["Jamais", "Rarement", "Parfois", "Souvent", "Toujours", "Non concerné / Je ne sais pas"], "required": true, "id": "emp_04"}, {"section": "terrain", "section_title": "Organisation réelle du travail", "prompt": "Disposez-vous des informations nécessaires avant de commencer une tâche ?", "type": "scale", "options": ["Jamais", "Rarement", "Parfois", "Souvent", "Toujours", "Non concerné / Je ne sais pas"], "required": true, "id": "emp_05"}, {"section": "terrain", "section_title": "Organisation réelle du travail", "prompt": "Lors des périodes chargées, la répartition du travail reste-t-elle claire ?", "type": "scale", "options": ["Jamais", "Rarement", "Parfois", "Souvent", "Toujours", "Non concerné / Je ne sais pas"], "required": true, "id": "emp_06"}, {"section": "terrain", "section_title": "Organisation réelle du travail", "prompt": "Les changements de dernière minute sont-ils communiqués suffisamment tôt ?", "type": "scale", "options": ["Jamais", "Rarement", "Parfois", "Souvent", "Toujours", "Non concerné / Je ne sais pas"], "required": true, "id": "emp_07"}, {"section": "terrain", "section_title": "Organisation réelle du travail", "prompt": "Pouvez-vous accomplir votre travail sans attendre inutilement une validation, un outil ou une autre équipe ?", "type": "scale", "options": ["Jamais", "Rarement", "Parfois", "Souvent", "Toujours", "Non concerné / Je ne sais pas"], "required": true, "id": "emp_08"}, {"section": "terrain", "section_title": "Organisation réelle du travail", "prompt": "À quel moment perdez-vous le plus de temps ?", "type": "multiple", "options": ["Avant le service", "Accueil / prise en charge", "Transmission entre équipes", "Production / préparation", "Service / exécution", "Encaissement / clôture", "Après le service", "Pas de perte de temps notable", "Autre / Non concerné"], "required": false, "id": "emp_09"}, {"section": "terrain", "section_title": "Organisation réelle du travail", "prompt": "Décrivez, si vous le souhaitez, une situation concrète qui ralentit votre travail.", "type": "long", "options": [], "required": false, "id": "emp_10"}, {"section": "moyens", "section_title": "Moyens, qualité et sécurité", "prompt": "Le matériel et les outils dont vous avez besoin sont-ils disponibles et fonctionnels ?", "type": "scale", "options": ["Jamais", "Rarement", "Parfois", "Souvent", "Toujours", "Non concerné / Je ne sais pas"], "required": true, "id": "emp_11"}, {"section": "moyens", "section_title": "Moyens, qualité et sécurité", "prompt": "Avez-vous suffisamment de temps et de moyens pour fournir un travail de qualité ?", "type": "scale", "options": ["Jamais", "Rarement", "Parfois", "Souvent", "Toujours", "Non concerné / Je ne sais pas"], "required": true, "id": "emp_12"}, {"section": "moyens", "section_title": "Moyens, qualité et sécurité", "prompt": "Lorsqu’un problème affecte le service ou la qualité, est-il traité durablement ?", "type": "scale", "options": ["Jamais", "Rarement", "Parfois", "Souvent", "Toujours", "Non concerné / Je ne sais pas"], "required": true, "id": "emp_13"}, {"section": "moyens", "section_title": "Moyens, qualité et sécurité", "prompt": "Vous sentez-vous en mesure de signaler une erreur ou un risque sans craindre une réaction injuste ?", "type": "scale", "options": ["Jamais", "Rarement", "Parfois", "Souvent", "Toujours", "Non concerné / Je ne sais pas"], "required": true, "id": "emp_14"}, {"section": "moyens", "section_title": "Moyens, qualité et sécurité", "prompt": "Quels obstacles rencontrez-vous le plus souvent ?", "type": "multiple", "options": ["Matériel manquant / défectueux", "Informations incomplètes", "Effectif ou renfort inadapté", "Consignes contradictoires", "Espaces / circulation peu pratiques", "Outils numériques compliqués", "Attente d’une décision", "Aucun obstacle majeur", "Autre / Non concerné"], "required": false, "id": "emp_15"}, {"section": "moyens", "section_title": "Moyens, qualité et sécurité", "prompt": "Quelle amélioration concrète aurait le plus d’effet sur la qualité de votre travail ?", "type": "long", "options": [], "required": false, "id": "emp_16"}, {"section": "collectif", "section_title": "Communication et fonctionnement collectif", "prompt": "Lorsque plusieurs équipes doivent collaborer, les transmissions se passent-elles correctement ?", "type": "scale", "options": ["Jamais", "Rarement", "Parfois", "Souvent", "Toujours", "Non concerné / Je ne sais pas"], "required": true, "id": "emp_17"}, {"section": "collectif", "section_title": "Communication et fonctionnement collectif", "prompt": "Quand vous avez une difficulté, trouvez-vous facilement la bonne personne pour vous aider ?", "type": "scale", "options": ["Jamais", "Rarement", "Parfois", "Souvent", "Toujours", "Non concerné / Je ne sais pas"], "required": true, "id": "emp_18"}, {"section": "collectif", "section_title": "Communication et fonctionnement collectif", "prompt": "Recevez-vous des retours utiles et concrets sur votre travail ?", "type": "scale", "options": ["Jamais", "Rarement", "Parfois", "Souvent", "Toujours", "Non concerné / Je ne sais pas"], "required": true, "id": "emp_19"}, {"section": "collectif", "section_title": "Communication et fonctionnement collectif", "prompt": "Vos propositions d’amélioration sont-elles écoutées et suivies d’une réponse ?", "type": "scale", "options": ["Jamais", "Rarement", "Parfois", "Souvent", "Toujours", "Non concerné / Je ne sais pas"], "required": true, "id": "emp_20"}, {"section": "collectif", "section_title": "Communication et fonctionnement collectif", "prompt": "Les règles sont-elles appliquées de façon cohérente d’une équipe ou d’un service à l’autre ?", "type": "scale", "options": ["Jamais", "Rarement", "Parfois", "Souvent", "Toujours", "Non concerné / Je ne sais pas"], "required": true, "id": "emp_21"}, {"section": "collectif", "section_title": "Communication et fonctionnement collectif", "prompt": "Qu’est-ce qui fonctionne particulièrement bien dans la coopération entre collègues ?", "type": "long", "options": [], "required": false, "id": "emp_22"}, {"section": "progression", "section_title": "Compétences, intégration et progression", "prompt": "À votre arrivée ou lors d’un changement de poste, avez-vous bénéficié d’une transmission suffisante ?", "type": "single", "options": ["Oui, tout à fait", "Plutôt oui", "Plutôt non", "Pas du tout", "Non concerné / Je ne sais pas"], "required": true, "id": "emp_23"}, {"section": "progression", "section_title": "Compétences, intégration et progression", "prompt": "Savez-vous où trouver les bonnes consignes lorsqu’une situation inhabituelle se présente ?", "type": "scale", "options": ["Jamais", "Rarement", "Parfois", "Souvent", "Toujours", "Non concerné / Je ne sais pas"], "required": true, "id": "emp_24"}, {"section": "progression", "section_title": "Compétences, intégration et progression", "prompt": "Vous sentez-vous suffisamment préparé(e) aux situations difficiles que vous rencontrez ?", "type": "scale", "options": ["Jamais", "Rarement", "Parfois", "Souvent", "Toujours", "Non concerné / Je ne sais pas"], "required": true, "id": "emp_25"}, {"section": "progression", "section_title": "Compétences, intégration et progression", "prompt": "Sur quel sujet un accompagnement ou une formation serait-il le plus utile ?", "type": "multiple", "options": ["Techniques métier", "Accueil et relation client", "Gestion des pics d’activité", "Coordination / communication", "Outils numériques", "Hygiène / sécurité", "Encadrement / management", "Aucun besoin particulier", "Autre / Non concerné"], "required": false, "id": "emp_26"}, {"section": "bilan", "section_title": "Forces et améliorations prioritaires", "prompt": "Quelles sont les deux principales forces de cet établissement, vues depuis le terrain ?", "type": "long", "options": [], "required": false, "id": "emp_27"}, {"section": "bilan", "section_title": "Forces et améliorations prioritaires", "prompt": "Si une seule chose pouvait changer dans les 30 prochains jours, laquelle choisiriez-vous ?", "type": "long", "options": [], "required": false, "id": "emp_28"}, {"section": "bilan", "section_title": "Forces et améliorations prioritaires", "prompt": "Avez-vous un exemple récent d’un problème récurrent que nous devrions observer sur place ?", "type": "long", "options": [], "required": false, "id": "emp_29"}, {"section": "bilan", "section_title": "Forces et améliorations prioritaires", "prompt": "Y a-t-il une pratique particulièrement réussie que nous devrions préserver ou étendre ?", "type": "long", "options": [], "required": false, "id": "emp_30"}];
const SECTIONS=[...new Map(QUESTIONS.map(q=>[q.section,q.section_title])).entries()];let step=-1;const answers={};const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){if(step===-1){app.innerHTML=`<div class="eyebrow">Questionnaire complémentaire au diagnostic dirigeant</div><h1>Votre expérience du terrain compte.</h1><p>Ce questionnaire cherche à comprendre les conditions réelles du travail, ce qui fonctionne bien et ce qui pourrait être amélioré. Il n'évalue pas individuellement les salariés.</p><div class="note"><strong>Confidentialité :</strong> aucun nom, e-mail ou identifiant personnel n'est demandé. Ne citez pas de personne ni de situation permettant de reconnaître quelqu'un dans les réponses libres. Les réponses seront destinées à une analyse regroupée, selon des règles à valider avant la mise en production. Vous pouvez passer les questions sensibles et choisir « Non concerné / Je ne sais pas » lorsqu'il apparaît.</div><p>Environ 8 à 10 minutes · 5 sections · aucune donnée envoyée pendant ce test.</p><div class="actions"><span></span><button onclick="next()">Commencer</button></div>`;return;}if(step===SECTIONS.length){app.innerHTML=`<div class="eyebrow">Fin du formulaire test</div><h1>Merci pour vos réponses.</h1><p>Vous avez terminé le questionnaire en mode prototype. Aucune réponse n'a été envoyée ou enregistrée en ligne.</p><div class="actions"><button class="secondary" onclick="step=SECTIONS.length-1;render()">Retour</button><button onclick="download()">Exporter les réponses test (JSON)</button></div>`;return;}const [sid,title]=SECTIONS[step], qs=QUESTIONS.filter(q=>q.section===sid);app.innerHTML=`<div class="eyebrow">Section ${step+1} / ${SECTIONS.length}</div><h1>${esc(title)}</h1><div class="progress"><div style="width:${(step+1)/SECTIONS.length*100}%"></div></div><form id="questions">${qs.map(q=>`<div class="q" data-id="${q.id}"><h3>${esc(q.prompt)} ${!q.required?'<span class="optional">· facultatif</span>':''}</h3>${q.type==='long'?`<textarea name="${q.id}" maxlength="700" placeholder="Décrivez des faits ou situations, sans citer de noms.">${esc(answers[q.id]||'')}</textarea>`:`<div class="options">${q.options.map((o,i)=>`<label class="option"><input type="${q.type==='multiple'?'checkbox':'radio'}" name="${q.id}" value="${esc(o)}" ${q.type==='multiple'?(Array.isArray(answers[q.id])&&answers[q.id].includes(o)?'checked':''):(answers[q.id]===o?'checked':'')}><span>${esc(o)}</span></label>`).join('')}</div>`}</div>`).join('')}</form><div id="err" class="error" role="alert"></div><div class="actions"><button class="secondary" onclick="back()">Retour</button><button onclick="next()">${step===SECTIONS.length-1?'Terminer':'Continuer'}</button></div>`;}
function save(){if(step<0||step>=SECTIONS.length)return true;const qs=QUESTIONS.filter(q=>q.section===SECTIONS[step][0]);for(const q of qs){const els=[...document.querySelectorAll(`[name="${q.id}"]`)];const v=q.type==='long'?(els[0].value.trim()):q.type==='multiple'?els.filter(x=>x.checked).map(x=>x.value):(els.find(x=>x.checked)?.value||'');if(q.required&&!v.length){document.getElementById('err').textContent='Veuillez répondre à cette question, ou choisir « Non concerné / Je ne sais pas ». ';return false;}answers[q.id]=v;}return true;}
function next(){if(!save())return;step++;render();window.scrollTo(0,0)}function back(){save();step--;render();window.scrollTo(0,0)}function download(){const blob=new Blob([JSON.stringify({prototype:true,answers},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='test_questionnaire_salarie_hp.json';a.click();URL.revokeObjectURL(a.href)}render();
</script></body></html>
