<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HP | Suivi post-intervention</title>
<style>
:root{font-family:Inter,Arial,sans-serif;background:#f6f6f2;color:#193b32;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}.top{background:#103d32;color:#fff;padding:18px max(20px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;gap:15px;align-items:center}.top b{font:700 24px Georgia,serif}.top small{display:block;font-size:12px;opacity:.75;margin-top:4px}.top a{background:#fff;color:#103d32;text-decoration:none;padding:10px 13px;border-radius:8px;font-weight:750}.wrap{max-width:1120px;padding:0 20px;margin:28px auto 64px}h1,h2,h3{font-family:Georgia,serif}h1{font-size:34px;margin:5px 0 8px}h2{font-size:24px;margin:0 0 11px}h3{font-size:19px;margin:0 0 7px}p{line-height:1.55}.muted{color:#69766e;font-size:12px}.lead{display:flex;gap:20px;justify-content:space-between;align-items:start;margin-bottom:24px}.tag{display:inline-flex;border-radius:99px;background:#e8eee9;color:#28584a;font-size:11px;font-weight:800;padding:6px 10px}.panel,.checkpoint,.stat{background:#fff;border:1px solid #e1e6e0;border-radius:13px}.panel{padding:22px;margin:20px 0}.notice{border-left:3px solid #b28a39;background:#fcf8ed;color:#725a27;padding:13px 15px;margin:15px 0;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.stat{padding:16px}.stat b{display:block;font:700 25px Georgia,serif;margin:9px 0 3px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{margin:12px 0}.field label{font-size:12px;font-weight:750;display:block;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d9e1d9;border-radius:8px;background:#fff;color:#193b32}.field textarea{resize:vertical;min-height:92px;line-height:1.5}.wide{grid-column:1/-1}.checkpoint{margin:18px 0;padding:20px}.checkhead{display:flex;align-items:start;justify-content:space-between;gap:16px}.checkhead p{margin:4px 0 0}.checkhead .tag{white-space:nowrap}.foot{border-top:1px solid #e3e9e2;padding-top:15px;margin-top:13px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.btn{border:0;border-radius:8px;background:#103d32;color:#fff;padding:11px 17px;font-weight:750;cursor:pointer}.btn:disabled{opacity:.55}.error{color:#aa4139}.actions{display:flex;gap:12px;flex-wrap:wrap}.actions a{color:#21654c;font-weight:750;text-decoration:none}.summaryItem{border-top:1px solid #e5eae4;padding:12px 0;line-height:1.5}.summaryItem:first-child{border-top:0}.empty{padding:20px;color:#6a766c}#chooser{max-width:680px}@media(max-width:700px){.grid,.stats{grid-template-columns:1fr 1fr}.grid .wide{grid-column:1/-1}.lead,.checkhead{display:block}.stats{gap:8px}.top{padding:15px}.panel,.checkpoint{padding:15px}h1{font-size:28px}}@media(max-width:440px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.stats{grid-template-columns:1fr 1fr}}@media print{.top,.noprint,button{display:none!important}.wrap{max-width:none;margin:0;padding:0}.panel,.checkpoint{break-inside:avoid;border-color:#d0d8d1}.field input,.field textarea,.field select{border:0;padding:3px 0;min-height:0}@page{size:A4 portrait;margin:14mm}}
</style></head><body>
<header class="top"><div><b>HP</b><small>Hospitality Performance · Continuité post-accompagnement</small></div><a id="back" href="bilan.html">Retour au bilan</a></header><main class="wrap" id="app"><div class="empty">Chargement du suivi post-intervention…</div></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.116.0';
const sb=createClient('https://wztiaiwjprarpdzsudpx.supabase.co','sb_publishable_JqSGi4QEil2MBaI5tYsQvA_wQnxz8U_');
const q=new URLSearchParams(location.search), app=document.getElementById('app');let proposalId=q.get('proposal')||'',proposal=null,review=null,checkpoints=[],steps=[],tracked=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=v=>v?new Date(v+'T12:00:00').toLocaleDateString('fr-FR'):'—';
const datePlus=(s,days)=>{if(!s)return '';const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10)};
function check(day){return checkpoints.find(x=>x.checkpoint_day===day)||{checkpoint_day:day,status:'Prévu',planned_date:'',observed_date:'',objective:'',observation:'',evidence_reference:'',next_decision:''}}
function render(){const done=steps.filter(s=>tracked.some(t=>t.proposal_item_id===s.proposal_item_id&&t.step_order===s.step_order&&t.status==='Terminé')).length;
app.innerHTML=`<section class="lead"><div><span class="tag">Suivi interne · J+30 / J+60 / J+90</span><h1>Continuité après intervention</h1><p>${esc(proposal.establishment_name)} · ${esc(proposal.proposal_name)}</p><div class="actions noprint"><a href="bilan.html?proposal=${encodeURIComponent(proposalId)}">Consulter le bilan initial</a><a href="suivi.html?proposal=${encodeURIComponent(proposalId)}">Consulter les actions d’origine</a></div></div><span class="tag">${esc(review?.assessment_status||'Bilan non renseigné')}</span></section>
<section class="stats"><article class="stat"><small>Actions initiales</small><b>${steps.length}</b></article><article class="stat"><small>Déclarées terminées</small><b>${done}</b></article><article class="stat"><small>Contrôles réalisés</small><b>${checkpoints.filter(x=>x.status==='Réalisé').length}/3</b></article><article class="stat"><small>État du bilan</small><b style="font:700 16px Inter,Arial,sans-serif">${esc(review?.assessment_status||'Absent')}</b></article></section>
<div class="notice">Ce suivi sert à vérifier la tenue des résultats et la continuité des actions après la date du bilan. Il n'ouvre pas une nouvelle mission, ne modifie pas le score HP et ne démontre pas à lui seul un impact économique. Toute nouvelle mesure doit conserver sa période, sa source et son niveau de comparabilité.</div>
<section class="panel"><h2>Point de départ : bilan d’intervention</h2><div class="grid"><div><b>Date du bilan</b><p>${esc(date(review?.review_date))}</p></div><div><b>État</b><p>${esc(review?.assessment_status||'Non enregistré')}</p></div><div class="wide"><b>Actions de suite définies au bilan</b><p>${esc(review?.next_steps||'Aucune action de suite documentée pour le moment.')}</p></div><div class="wide"><b>Conclusion du consultant</b><p>${esc(review?.consultant_conclusion||'Aucune conclusion enregistrée.')}</p></div></div>${review?.review_date?'':'<p class="muted">Aucune date de bilan disponible : les échéances sont à saisir manuellement. Aucun point de contrôle n’est considéré réalisé par défaut.</p>'}</section>
<section class="panel"><h2>Trois points de contrôle</h2><p class="muted">Les dates suggérées sont calculées sur la date du bilan, sans écraser une échéance déjà sauvegardée. Le statut « Réalisé » exige une date d’observation et un constat écrit.</p>${[30,60,90].map(day=>{const x=check(day),proposed=x.planned_date||datePlus(review?.review_date,day);return `<article class="checkpoint" data-day="${day}"><div class="checkhead"><div><h3>J+${day} · ${day===30?'Mise en œuvre':day===60?'Stabilisation':'Pérennisation'}</h3><p class="muted">${day===30?'Vérifier l’application concrète des décisions et identifier les premiers écarts.':day===60?'Observer les routines et résoudre les difficultés persistantes.':'Confirmer la pérennité des pratiques et décider d’une éventuelle nouvelle intervention.'}</p></div><span class="tag">${esc(x.status)}</span></div><div class="grid"><div class="field"><label>Échéance</label><input type="date" data-f="planned_date" value="${esc(proposed)}"></div><div class="field"><label>Date du constat</label><input type="date" data-f="observed_date" value="${esc(x.observed_date||'')}"></div><div class="field"><label>État du contrôle</label><select data-f="status">${['Prévu','En cours','Réalisé','Reporté'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Objectif du contrôle</label><input maxlength="1500" data-f="objective" value="${esc(x.objective||'')}" placeholder="Ce qui doit être vérifié"></div><div class="field wide"><label>Constats factuels</label><textarea maxlength="5000" data-f="observation" placeholder="Pratiques maintenues, progrès observés, écarts, limites…">${esc(x.observation||'')}</textarea></div><div class="field"><label>Preuve / document / mesure</label><textarea maxlength="1000" data-f="evidence_reference" placeholder="Référence interne, document, lien…">${esc(x.evidence_reference||'')}</textarea></div><div class="field"><label>Décision et prochaine action</label><textarea maxlength="3000" data-f="next_decision" placeholder="Maintenir, ajuster, vérifier à nouveau…">${esc(x.next_decision||'')}</textarea></div></div><div class="foot"><span class="muted" data-msg>${x.updated_at?'Mis à jour le '+new Date(x.updated_at).toLocaleString('fr-FR'):'Contrôle non enregistré'}</span><button class="btn noprint" data-save>Enregistrer J+${day}</button></div></article>`}).join('')}</section>
<section class="panel"><h2>Synthèse de continuité</h2><div id="recap">${[30,60,90].map(day=>{const x=check(day);return `<div class="summaryItem"><b>J+${day} · ${esc(x.status)}</b><div class="muted">Échéance : ${esc(date(x.planned_date||datePlus(review?.review_date,day)))} · Constat : ${esc(date(x.observed_date))}</div>${x.observation?`<p>${esc(x.observation)}</p>`:''}${x.next_decision?`<p><b>Suite :</b> ${esc(x.next_decision)}</p>`:''}</div>`}).join('')}</div><p class="muted">Restitution interne, fondée sur les contrôles déclarés par le consultant. Toute validation de résultat nécessite une preuve identifiable.</p><button class="btn noprint" id="print">Imprimer / enregistrer en PDF</button></section>`;
app.querySelectorAll('[data-save]').forEach(b=>b.addEventListener('click',()=>save(b.closest('.checkpoint'))));document.getElementById('print').onclick=()=>window.print();}
async function save(node){const day=Number(node.dataset.day),get=f=>node.querySelector(`[data-f="${f}"]`).value.trim(),button=node.querySelector('[data-save]'),msg=node.querySelector('[data-msg]');let payload={proposal_id:proposalId,checkpoint_day:day,planned_date:get('planned_date')||null,observed_date:get('observed_date')||null,status:get('status'),objective:get('objective'),observation:get('observation'),evidence_reference:get('evidence_reference'),next_decision:get('next_decision'),updated_at:new Date().toISOString()};if(payload.status==='Réalisé'&&(!payload.observed_date||!payload.observation)){msg.textContent='Pour marquer « Réalisé », renseigner la date du constat et une observation.';msg.className='error';return;}if(payload.observed_date&&payload.planned_date&&payload.observed_date<datePlus(payload.planned_date,-365)){msg.textContent='La date de constat paraît incohérente : veuillez la vérifier.';msg.className='error';return;}button.disabled=true;msg.className='muted';msg.textContent='Enregistrement…';try{const {data,error}=await sb.from('hp_post_intervention_checkpoints').upsert(payload,{onConflict:'proposal_id,checkpoint_day'}).select('*').single();if(error)throw error;checkpoints=checkpoints.filter(x=>x.checkpoint_day!==day).concat(data);render();const m=app.querySelector(`.checkpoint[data-day="${day}"] [data-msg]`);if(m)m.textContent='Enregistré · '+new Date(data.updated_at).toLocaleString('fr-FR');}catch(e){msg.className='error';msg.textContent='Enregistrement impossible : '+e.message;button.disabled=false}}
async function chooser(){const {data,error}=await sb.from('hp_proposals').select('id,proposal_name,status,created_at').order('created_at',{ascending:false}).limit(100);if(error)throw error;app.innerHTML=`<section class="panel" id="chooser"><h1>Choisir un accompagnement</h1><p class="muted">Chaque suivi post-intervention est rattaché à une proposition enregistrée.</p><div class="field"><label>Proposition</label><select id="choice"><option value="">Sélectionner…</option>${(data||[]).map(x=>`<option value="${esc(x.id)}">${esc(x.proposal_name)} · ${esc(x.status)} · ${new Date(x.created_at).toLocaleDateString('fr-FR')}</option>`).join('')}</select></div><button class="btn" id="open">Ouvrir le suivi</button></section>`;document.getElementById('open').onclick=()=>{const id=document.getElementById('choice').value;if(id)location.href='post_bilan.html?proposal='+encodeURIComponent(id)}}
async function load(){const {data:{session},error:authError}=await sb.auth.getSession();if(authError)throw authError;if(!session){app.innerHTML='<section class="panel error">Connexion requise. Connecte-toi depuis l’Administration HP puis ouvre cette page.</section>';return;}if(!proposalId){await chooser();return;}document.getElementById('back').href='bilan.html?proposal='+encodeURIComponent(proposalId);const [p,r,st,items,head]=await Promise.all([sb.from('hp_proposals').select('id,diagnostic_id,proposal_name,status').eq('id',proposalId).single(),sb.from('hp_intervention_reviews').select('*').eq('proposal_id',proposalId).maybeSingle(),sb.from('hp_proposal_action_plan_v1').select('proposal_item_id,step_order').eq('proposal_id',proposalId),sb.from('hp_proposal_items').select('id').eq('proposal_id',proposalId),sb.from('hp_consultant_mission_v1').select('establishment_name').eq('proposal_id',proposalId).limit(1)]);for(const x of [p,r,st,items,head])if(x.error)throw x.error;proposal={...p.data,establishment_name:head.data?.[0]?.establishment_name||'Établissement'};review=r.data||null;steps=st.data||[];const ids=(items.data||[]).map(x=>x.id);const [t,c]=await Promise.all([ids.length?sb.from('hp_mission_step_tracking').select('proposal_item_id,step_order,status').in('proposal_item_id',ids):Promise.resolve({data:[],error:null}),sb.from('hp_post_intervention_checkpoints').select('*').eq('proposal_id',proposalId)]);if(t.error)throw t.error;if(c.error)throw c.error;tracked=t.data||[];checkpoints=c.data||[];render()}
load().catch(e=>{console.error(e);app.innerHTML=`<section class="panel error">Erreur de chargement : ${esc(e.message)}</section>`});
</script></body></html>
