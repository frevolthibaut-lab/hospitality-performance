<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Assistant de mission | Hospitality Performance</title>
<style>
:root{
  --green:#0B3D2E;--green2:#125746;--greenSoft:#E8F0EC;
  --paper:#FFFEFB;--stone:#F6F4EF;--ink:#171916;--muted:#686d69;
  --line:#DDD8CE;--gold:#B99A68;--danger:#A34D45;
}
*{box-sizing:border-box}
html{background:var(--stone)}
body{
  margin:0;color:var(--ink);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(180deg,#f8f6f1 0%,#f2efe8 100%);
}
button{font:inherit}
.top{
  position:sticky;top:0;z-index:20;
  height:76px;display:flex;align-items:center;justify-content:space-between;
  padding:0 30px;background:rgba(255,254,251,.96);border-bottom:1px solid var(--line);
  backdrop-filter:blur(14px)
}
.brand{display:flex;align-items:baseline;gap:16px}
.brand b{font:600 34px/.9 "Playfair Display",Georgia,serif;color:var(--green)}
.brand span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#6d756f}
.actions{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:9px 12px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.wrap{max-width:1380px;margin:0 auto;padding:30px}
.hero{
  display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start;
  padding:28px;border:1px solid var(--line);border-radius:14px;background:var(--paper);
  box-shadow:0 10px 28px rgba(35,40,36,.045)
}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--green2)}
h1,h2,h3,h4{font-family:"Playfair Display",Georgia,serif}
h1{margin:7px 0 8px;font-size:38px;line-height:1.05}
.hero p{margin:0;color:var(--muted);line-height:1.55}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.badge{padding:6px 9px;border-radius:999px;background:#eef2ef;color:#415a51;font-size:10px;font-weight:800}
.total{text-align:right}
.total small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.12em}
.total b{display:block;margin-top:5px;font:600 30px/1 Georgia,serif;color:var(--green)}
.notice{margin:16px 0;padding:13px 15px;border-left:4px solid var(--gold);background:#fbf5e8;border-radius:8px;color:#645d50;font-size:12px;line-height:1.5}
.service{
  margin-top:18px;padding:24px;border:1px solid var(--line);border-radius:14px;background:var(--paper);
  box-shadow:0 7px 20px rgba(35,40,36,.035);break-inside:avoid
}
.serviceHead{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;padding-bottom:15px;border-bottom:1px solid #e9e5dc}
.service h2{font-size:25px;margin:3px 0 7px}
.serviceHead p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}
.rank{text-align:right}
.rank b{display:block;font-size:11px;color:var(--green)}
.rank span{font-size:10px;color:var(--muted)}
.metaGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:15px 0}
.meta{padding:11px;border:1px solid #e8e4db;border-radius:9px;background:#fbfaf7}
.meta small{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.08em;color:#7b807c;margin-bottom:4px}
.meta b{font-size:10px}
.blockTitle{margin:18px 0 8px;font-size:15px;color:#1f463b}
.documents{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.item{padding:9px 10px;border:1px solid #e7e4dc;border-radius:8px;background:#fff;font-size:10.5px;line-height:1.42}
.methodGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.method{
  min-height:185px;border:1px solid #e5e2da;border-radius:10px;overflow:hidden;background:#fff
}
.method h3{margin:0;padding:12px 13px;background:var(--green);color:#fff;font-size:14px}
.method ul{margin:0;padding:12px 15px 12px 27px}
.method li{margin:0 0 8px;font-size:10.5px;line-height:1.42;color:#45514c}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.step{padding:13px;border:1px solid #e5e2da;border-radius:10px;background:#fff}
.stepPhase{font-size:8.5px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--green2)}
.step h4{margin:5px 0;font-size:13px}
.step p{margin:0;color:#5d6762;font-size:10px;line-height:1.42}
.stepFoot{margin-top:9px;padding-top:8px;border-top:1px solid #eeeae2;font-size:9px;line-height:1.4;color:#59645f}
.vigilance{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.warn{padding:10px 12px;border-left:3px solid var(--gold);background:#fff8eb;border-radius:7px;font-size:10px;line-height:1.45;color:#665d4b}
.terrainPanel{margin:16px 0;padding:14px 16px;border:1px solid #d8dfe2;border-left:4px solid #87949c;border-radius:10px;background:#fafbfc;break-inside:avoid;--status-bg:#edf0f3;--status-ink:#58616b;--status-border:#d8dfe5;print-color-adjust:exact;-webkit-print-color-adjust:exact}
.terrainPanel h3{margin:0 0 6px;font-size:15px;color:#30453c}
.terrainPanel p{font-size:10.5px;line-height:1.55;color:#3d5146;margin:5px 0}
.terrainPanel .terrainTag{display:inline-block;font-size:9px;font-weight:800;padding:5px 8px;border-radius:12px;background:var(--status-bg);color:var(--status-ink);border:1px solid var(--status-border);margin:4px 0}
.terrainPanel.terrainConfirmed{border-color:#77ad83;border-left-color:#278247;background:#f0f8f0;--status-bg:#267a42;--status-ink:#fff;--status-border:#267a42}
.terrainPanel.terrainPartial{border-color:#ebd19b;border-left-color:#b7790d;background:#fffaf0;--status-bg:#fff2d7;--status-ink:#7c530a;--status-border:#ebd19b}
.terrainPanel.terrainStrength{border-color:#b9d0e8;border-left-color:#286ca3;background:#f3f8fe;--status-bg:#e8f0fa;--status-ink:#245886;--status-border:#b9d0e8}
.terrainPanel.terrainUnconfirmed{border-color:#d8dfe5;border-left-color:#667381;background:#f8f9fa;--status-bg:#edf0f3;--status-ink:#58616b;--status-border:#d8dfe5}
.terrainPanel.terrainPending{border-color:#e6dbb9;border-left-color:#a78328;background:#fffcf5;--status-bg:#fcf1d2;--status-ink:#745715;--status-border:#e6dbb9}
.terrainPanel.terrainInsufficient{border-color:#dfc9ca;border-left-color:#a46e71;background:#fcf7f7;--status-bg:#f8e9e9;--status-ink:#854c51;--status-border:#dfc9ca}
.terrainPanel .terrainDataNote{padding:7px 9px;border-left:3px solid #95a5ac;background:#f0f3f4;border-radius:3px;color:#43515a}
.terrainPanel .terrainTasks{margin:7px 0 0;padding-left:19px;font-size:10px;line-height:1.55}
.terrainPanel .terrainNote{color:#657269;font-size:9.5px;margin-top:9px}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.loading{padding:70px;text-align:center;color:var(--muted)}
@media(max-width:950px){
 .wrap{padding:16px}.hero{grid-template-columns:1fr}.total{text-align:left}
 .metaGrid,.methodGrid,.steps{grid-template-columns:1fr 1fr}
}
@media(max-width:620px){.metaGrid,.methodGrid,.steps,.documents,.vigilance{grid-template-columns:1fr}}
@media print{
 @page{size:A4 landscape;margin:10mm}
 body{background:#fff}
 .top{display:none!important}
 .wrap{max-width:none;padding:0}
 .hero,.service{box-shadow:none}
 .service{page-break-before:always;border:0;padding:0}
 .service:first-of-type{page-break-before:auto}
}

/* Diagnostic-wide field summary: independent of selected proposal services. */
.fieldOverview{margin:18px 0;padding:20px 22px;background:#fff;border:1px solid var(--line);border-radius:14px;break-inside:avoid}
.fieldOverview h2{font-size:22px;margin:0 0 6px;color:#25483b}
.fieldOverview > p{font-size:11px;color:#62736a;line-height:1.55;margin:0 0 12px}
.fieldOverviewGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.fieldOverviewCard{padding:12px;border:1px solid var(--status-border,#d8dfe5);border-left:4px solid var(--status-accent,#87949c);border-radius:8px;background:var(--status-panel,#fafbfc);break-inside:avoid}
.fieldOverviewCard strong{display:block;font-size:12px;color:#253e35;margin-bottom:7px}
.fieldOverviewCard .terrainTag{display:inline-block;font-size:10px;font-weight:800;padding:5px 8px;border-radius:12px;background:var(--status-bg,#edf0f3);color:var(--status-ink,#58616b);border:1px solid var(--status-border,#d8dfe5)}
.fieldOverviewCard p{font-size:10px;line-height:1.5;margin:7px 0 0;color:#4b5b53}
.fieldOverviewCard.terrainConfirmed{--status-border:#77ad83;--status-accent:#278247;--status-panel:#f0f8f0;--status-bg:#267a42;--status-ink:#fff}
.fieldOverviewCard.terrainPartial{--status-border:#ebd19b;--status-accent:#b7790d;--status-panel:#fffaf0;--status-bg:#fff2d7;--status-ink:#7c530a}
.fieldOverviewCard.terrainStrength{--status-border:#b9d0e8;--status-accent:#286ca3;--status-panel:#f3f8fe;--status-bg:#e8f0fa;--status-ink:#245886}
.fieldOverviewCard.terrainUnconfirmed{--status-border:#d8dfe5;--status-accent:#667381;--status-panel:#f8f9fa;--status-bg:#edf0f3;--status-ink:#58616b}
.fieldOverviewCard.terrainPending{--status-border:#e6dbb9;--status-accent:#a78328;--status-panel:#fffcf5;--status-bg:#fcf1d2;--status-ink:#745715}
.fieldOverviewCard.terrainInsufficient{--status-border:#dfc9ca;--status-accent:#a46e71;--status-panel:#fcf7f7;--status-bg:#f8e9e9;--status-ink:#854c51}
@media(max-width:680px){.fieldOverviewGrid{grid-template-columns:1fr}}

/* PDF-only layout. The exporter renders each section independently at a fixed width. */
.pdf-export{width:1000px!important;max-width:1000px!important;box-sizing:border-box!important;padding:0!important;background:#fff!important;margin:0!important}
.pdf-export .hero,.pdf-export .service{box-shadow:none!important}
.pdf-export .hero{margin:0 0 16px!important;padding:23px!important;grid-template-columns:minmax(0,1fr) auto!important}
.pdf-export .fieldOverview{margin:0 0 16px!important;padding:16px 18px!important}
.pdf-export.service,.pdf-export .service{margin:0!important;padding:0!important;border:0!important;border-radius:0!important;break-before:auto!important;page-break-before:auto!important;break-inside:auto!important}
.pdf-export .serviceHead{padding-bottom:12px!important}
.pdf-export .terrainPanel{padding:11px 14px!important;margin:12px 0!important}
.pdf-export .metaGrid{margin:11px 0!important}
.pdf-export .blockTitle{margin:14px 0 7px!important}
.pdf-export .metaGrid,.pdf-export .methodGrid{grid-template-columns:repeat(4,minmax(0,1fr))!important}
.pdf-export .steps{grid-template-columns:repeat(3,minmax(0,1fr))!important}
.pdf-export .documents,.pdf-export .vigilance,.pdf-export .fieldOverviewGrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.pdf-export .fieldOverviewGrid,.pdf-export .documents,.pdf-export .vigilance,.pdf-export .methodGrid,.pdf-export .steps{align-items:stretch}
.pdf-export .method{min-height:150px!important}
.pdf-export *{box-sizing:border-box!important}
.pdf-export .hero,.pdf-export .serviceHead,.pdf-export .fieldOverview,.pdf-export .terrainPanel{max-width:100%!important}

</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>HP</b><span>Assistant de mission consultant</span></div>
  <div class="actions"><button class="btn" id="closeBtn">Fermer</button><button class="btn primary" id="printBtn">Télécharger le rapport PDF</button></div>
</header>
<main class="wrap">
  <div id="app" class="loading">Chargement du plan de mission…</div>
</main>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.116.0";
const SUPABASE_URL="https://wztiaiwjprarpdzsudpx.supabase.co";
const SUPABASE_KEY="sb_publishable_JqSGi4QEil2MBaI5tYsQvA_wQnxz8U_";
const sb=createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const arr=v=>Array.isArray(v)?v:[];
const money=v=>Number(v||0).toLocaleString("fr-FR",{maximumFractionDigits:0})+" €";
// Advisory bridge only: primary criterion maps to one controlled domain. No scoring changes.
const fieldByCriterion={H3:"communication",H2:"management",H4:"onboarding",O1:"procedures",O2:"service_flow"};
const domainDescriptions={
 communication:{name:"Communication et transmissions",tasks:["Observer un briefing et une passation réelle","Demander où consulter la dernière consigne","Vérifier un exemple récent de transmission incomplète","Confirmer les règles de communication avec le responsable"]},
 management:{name:"Management et participation",tasks:["Observer un rituel managérial réel","Vérifier un exemple de feedback réalisé","Vérifier le traitement d’une proposition terrain","Confronter l’organisation déclarée aux pratiques observées"]},
 onboarding:{name:"Intégration et montée en compétences",tasks:["Reconstituer un parcours de prise de poste","Contrôler les supports disponibles","Vérifier qui accompagne et valide l’autonomie","Contrôler la préparation à une situation difficile"]},
 procedures:{name:"Procédures et traitement des incidents",tasks:["Demander une procédure opérationnelle critique","Tester son accès sur le poste de travail","Vérifier la traçabilité d’un incident récurrent","Observer une mise en application réelle"]},
 service_flow:{name:"Fluidité et organisation du service",tasks:["Observer un service en période chargée","Identifier les attentes et points de validation","Vérifier la répartition effective des postes","Décrire une piste d’amélioration testable"]}
};
let fieldValidations=[];
let collectiveReady=false;
let collectiveCount=0;
let fieldLoadError="";

const fieldStateClass={"Problème confirmé":"terrainConfirmed","Partiellement confirmé":"terrainPartial","Point fort confirmé":"terrainStrength","Non confirmé":"terrainUnconfirmed","À investiguer":"terrainPending","Données insuffisantes":"terrainInsufficient"};
const fieldCriterion={communication:"H3",management:"H2",onboarding:"H4",procedures:"O1",service_flow:"O2"};
function renderFieldOverview(rows){
 const selected=new Set(rows.map(x=>String(x.source_criterion_code||"").trim()));
 const cards=Object.keys(domainDescriptions).map(domain=>{
   const d=domainDescriptions[domain],v=fieldValidations.find(x=>x.domain_code===domain);
   const status=fieldLoadError?"Données insuffisantes":v?.conclusion||"À investiguer";
   const state=fieldStateClass[status]||"terrainPending";
   const criterion=fieldCriterion[domain];
   const checked=arr(v?.checked_tasks).filter(i=>Number.isInteger(i)&&i>=0&&i<d.tasks.length);
   return `<div class="fieldOverviewCard ${state}">
     <strong>${esc(d.name)} · ${criterion}</strong>
     <span class="terrainTag">${fieldLoadError?"Chargement indisponible":esc(status)}</span>
     <p>${fieldLoadError?esc(fieldLoadError):v?`Contrôles réalisés : ${checked.length}/${d.tasks.length}.`:"Pas encore de conclusion enregistrée."}</p>
     ${v?.observation?`<p><b>Observation :</b> ${esc(v.observation)}</p>`:""}
     ${v?.evidence_note?`<p><b>Référence de preuve :</b> ${esc(v.evidence_note)}</p>`:""}
     <p>${selected.has(criterion)?"Prestation correspondante présente dans cette proposition.":"Aucune prestation correspondante dans cette proposition ; la validation reste visible ici."}</p>
   </div>`;
 }).join("");
 return `<section class="fieldOverview" id="fieldOverview"><div class="eyebrow">Diagnostic transversal · Usage interne</div>
   <h2>Validations du consultant — tous les domaines</h2>
   <p>Ces conclusions concernent le diagnostic entier, même si la prestation associée n’a pas été retenue dans la proposition. Les données salariées collectives sont indépendantes de cette validation. Aucune modification automatique du HP Score ni de la proposition.</p>
   <div class="fieldOverviewGrid">${cards}</div></section>`;
}

function terrainPanel(row){
 const domain=fieldByCriterion[String(row.source_criterion_code||"").trim()];
 if(!domain)return `<div class="terrainPanel"><h3>Validation terrain · Pas de correspondance directe</h3><p>Cette prestation ne possède pas de rapprochement univoque avec les cinq domaines du questionnaire salarié. Conserver les vérifications méthodologiques de la prestation ; aucun résultat terrain n’est extrapolé.</p></div>`;
 const d=domainDescriptions[domain];
 const v=fieldValidations.find(x=>x.domain_code===domain);
 const status=v?.conclusion||"À investiguer";
 const stateClasses={"Problème confirmé":"terrainConfirmed","Partiellement confirmé":"terrainPartial","Point fort confirmé":"terrainStrength","Non confirmé":"terrainUnconfirmed","À investiguer":"terrainPending","Données insuffisantes":"terrainInsufficient"};
 const statusClass=fieldLoadError?"terrainInsufficient":(stateClasses[status]||"terrainPending");
 const checked=arr(v?.checked_tasks).filter(i=>Number.isInteger(i)&&i>=0&&i<d.tasks.length);
 const detail=fieldLoadError?`Données de validation indisponibles : ${esc(fieldLoadError)}`:(v?"Conclusion enregistrée par le consultant.":"Aucune validation enregistrée pour ce domaine.");
 return `<div class="terrainPanel ${statusClass}">
  <h3>Lecture terrain · ${esc(d.name)}</h3>
  <span class="terrainTag">${fieldLoadError?"Validation indisponible":esc(status)}</span>
  <p>${detail} Critère principal de la prestation : ${esc(row.source_criterion_code||"—")}.</p>
  <p class="terrainDataNote"><b>Disponibilité des données salariées (indépendante de la conclusion consultant) :</b> ${collectiveReady?`${collectiveCount} questionnaire(s) collecté(s) ; seules les données agrégées autorisées sont utilisées dans l’Administration. Ce statut ne démontre pas à lui seul une convergence.`:"Restitution collective non disponible ou seuil de confidentialité non atteint. Ne pas inférer un constat salarié."}</p>
  ${v?.observation?`<p><b>Observation consultant :</b> ${esc(v.observation)}</p>`:""}
  ${v?.evidence_note?`<p><b>Référence de preuve :</b> ${esc(v.evidence_note)}</p>`:""}
  <p><b>Contrôles documentés :</b> ${checked.length}/${d.tasks.length}.</p>
  <ul class="terrainTasks">${d.tasks.map((t,i)=>`<li>${checked.includes(i)?"✓ Réalisé — ":"À vérifier — "}${esc(t)}</li>`).join("")}</ul>
  <p class="terrainNote">Lecture interne actualisée à l’ouverture du rapport. Elle ne change ni la proposition enregistrée, ni le classement, ni le HP Score. Une difficulté confirmée doit être étayée avant sa restitution au client.</p>
 </div>`;
}


function list(items){
  return arr(items).map(x=>`<div class="item">${esc(x)}</div>`).join("")||'<div class="item">Aucun élément renseigné.</div>';
}
function ul(items){
  return `<ul>${arr(items).map(x=>`<li>${esc(x)}</li>`).join("")||"<li>Aucune tâche renseignée.</li>"}</ul>`;
}
function steps(v){
  const x=Array.isArray(v)?v:[];
  return x.map(s=>`<div class="step">
    <div class="stepPhase">${esc(s.phase||"")}</div>
    <h4>${esc(s.action_title||"Action")}</h4>
    <p>${esc(s.action_description||"")}</p>
    <div class="stepFoot"><b>Livrable :</b> ${esc(s.deliverable||"—")}<br><b>Réussite :</b> ${esc(s.success_indicator||"—")}</div>
  </div>`).join("")||'<div class="item">Aucune étape méthodologique disponible.</div>';
}

async function resolveProposal(){
  const q=new URLSearchParams(location.search);
  const proposal=q.get("proposal");
  if(proposal)return proposal;
  const diagnostic=q.get("diagnostic");
  if(!diagnostic)return null;
  const {data,error}=await sb.from("hp_proposals").select("id,status,created_at").eq("diagnostic_id",diagnostic).order("created_at",{ascending:false});
  if(error)throw error;
  return (data||[]).find(x=>x.status==="Acceptée")?.id
    ||(data||[]).find(x=>x.status==="Proposée")?.id
    ||data?.[0]?.id
    ||null;
}

async function load(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){
    $("app").innerHTML='<div class="empty"><h2>Connexion requise</h2><p>Ouvre ce rapport depuis l’Administration HP après connexion.</p></div>';
    return;
  }
  const proposalId=await resolveProposal();
  if(!proposalId){
    $("app").innerHTML='<div class="empty"><h2>Aucune proposition enregistrée</h2><p>Enregistre d’abord une proposition d’accompagnement dans Administration.</p></div>';
    return;
  }
  const {data,error}=await sb.from("hp_consultant_mission_v1").select("*").eq("proposal_id",proposalId).order("sort_order");
  if(error)throw error;
  if(!data?.length){
    $("app").innerHTML='<div class="empty"><h2>Plan de mission indisponible</h2><p>Aucune prestation n’est rattachée à cette proposition.</p></div>';
    return;
  }
  // Read-only supplementary data. An unavailable field module must not prevent the mission plan from opening.
  const diagnosticId=data[0]?.diagnostic_id;
  fieldValidations=[];collectiveReady=false;collectiveCount=0;fieldLoadError="";
  if(diagnosticId){
    const [fieldResult,summaryResult]=await Promise.allSettled([
      sb.from("hp_consultant_field_validations").select("domain_code,conclusion,checked_tasks,observation,evidence_note,updated_at").eq("diagnostic_id",diagnosticId),
      sb.rpc("hp_employee_summary",{p_diagnostic_id:diagnosticId})
    ]);
    if(fieldResult.status==="fulfilled"&&!fieldResult.value.error)fieldValidations=arr(fieldResult.value.data);
    else fieldLoadError=fieldResult.status==="rejected"?String(fieldResult.reason?.message||"Chargement impossible"):String(fieldResult.value.error?.message||"Chargement impossible");
    if(summaryResult.status==="fulfilled"&&!summaryResult.value.error){
      const v=summaryResult.value.data;
      const obj=Array.isArray(v)?v[0]:v;
      collectiveReady=Boolean(obj?.ready);
      collectiveCount=Number(obj?.responses||0);
    }
  }
  render(data);
}

function render(rows){
  const h=rows[0];
  const prerequisites=[...new Set(rows.flatMap(x=>arr(x.unmet_dependencies)))];
  $("app").className="";
  $("app").innerHTML=`
    <section class="hero">
      <div>
        <div class="eyebrow">Assistant méthodologique · Usage interne</div>
        <h1>${esc(h.establishment_name)}</h1>
        <p>${esc(h.proposal_name)} · Ce document transforme les prestations retenues en plan d’exécution pour le consultant HP.</p>
        <div class="badges">
          <span class="badge">${esc(h.proposal_status)}</span>
          <span class="badge">${rows.length} prestation${rows.length>1?"s":""}</span>
          <span class="badge">Méthodologie ${esc(h.methodology_version||"v1")}</span>
        </div>
      </div>
      <div class="total"><small>Montant de la proposition</small><b>${money(h.total_amount)}</b></div>
    </section>
    ${renderFieldOverview(rows)}
    ${prerequisites.length?`<div class="notice"><b>Prérequis à traiter avant certaines prestations :</b> ${esc(prerequisites.join(" · "))}</div>`:""}
    ${rows.map((r,i)=>`
      <section class="service">
        <div class="serviceHead">
          <div>
            <div class="eyebrow">${esc(r.service_family)} · Mission ${i+1}</div>
            <h2>${esc(r.service_name)}</h2>
            <p>${esc(r.mission_objective||r.proposal_rationale||"")}</p>
          </div>
          <div class="rank"><b>${esc(r.intervention_level||"")}</b><span>${esc(r.evidence_status||"")}</span></div>
        </div>

        <div class="metaGrid">
          <div class="meta"><small>Durée</small><b>${esc(r.duration||"—")}</b></div>
          <div class="meta"><small>Format</small><b>${esc(r.format||"—")}</b></div>
          <div class="meta"><small>Critère source</small><b>${esc(r.source_criterion_code||"—")} · ${r.source_score??"—"}/5</b></div>
          <div class="meta"><small>Pertinence HP</small><b>${r.recommendation_score??"—"}/100 · ${esc(r.recommendation_level||"")}</b></div>
        </div>

        ${terrainPanel(r)}

        <h3 class="blockTitle">Documents et informations à récupérer</h3>
        <div class="documents">${list(r.required_documents)}</div>

        <h3 class="blockTitle">Méthode de travail</h3>
        <div class="methodGrid">
          <div class="method"><h3>À préparer avant RDV</h3>${ul(r.preparation_tasks)}</div>
          <div class="method"><h3>À faire avec le client</h3>${ul(r.client_tasks)}</div>
          <div class="method"><h3>À produire après</h3>${ul(r.post_tasks)}</div>
          <div class="method"><h3>À mesurer / contrôler</h3>${ul(r.measurement_tasks)}</div>
        </div>

        <h3 class="blockTitle">Plan d’exécution de la prestation</h3>
        <div class="steps">${steps(r.action_steps)}</div>

        <h3 class="blockTitle">Points de vigilance consultant</h3>
        <div class="vigilance">${arr(r.vigilance_points).map(x=>`<div class="warn">${esc(x)}</div>`).join("")||'<div class="warn">Aucun point de vigilance spécifique.</div>'}</div>
      </section>
    `).join("")}
  `;
}


// Direct PDF generation avoids html2pdf's single-image page slicing, which cropped
// the left edge of the supplied 8-page export. Each report section is rendered in
// its own fixed-width canvas; mission starts and block breaks are explicit.
let pdfLibraryPromise=null;
function loadScript(url,ready){
 if(ready())return Promise.resolve();
 return new Promise((resolve,reject)=>{
  const script=document.createElement('script');script.src=url;
  script.onload=()=>ready()?resolve():reject(new Error('Module PDF indisponible.'));
  script.onerror=()=>reject(new Error('Impossible de charger le module PDF. Vérifiez la connexion Internet.'));
  document.head.appendChild(script);
 });
}
function loadPdfLibrary(){
 if(pdfLibraryPromise)return pdfLibraryPromise;
 pdfLibraryPromise=Promise.all([
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',()=>typeof window.html2canvas==='function'),
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js',()=>typeof window.jspdf?.jsPDF==='function')
 ]).catch(e=>{pdfLibraryPromise=null;throw e});
 return pdfLibraryPromise;
}
function reportPdfFilename(){
 const name=($('app').querySelector('.hero h1')?.textContent||'Etablissement').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'_').replace(/^_+|_+$/g,'').slice(0,60)||'Etablissement';
 return `HP_Rapport_Consultant_${name}_${new Date().toISOString().slice(0,10)}.pdf`;
}
function pdfSections(source){
 const children=[...source.children], intro=document.createElement('section');
 intro.className='pdf-export';
 const services=[];
 for(const child of children){
  if(child.classList.contains('service')){
   const copy=child.cloneNode(true);copy.classList.add('pdf-export');services.push(copy);
  }else intro.appendChild(child.cloneNode(true));
 }
 return [{node:intro,label:'SYNTHÈSE ET VALIDATIONS',mission:0},...services.map((node,i)=>({node,label:`MISSION ${i+1}`,mission:i+1}))];
}
function getBreaks(el){
 // Prefer section boundaries. A heading stays with the block immediately below it.
 const h=el.getBoundingClientRect(),items=[...el.children],ends=[];
 for(let i=0;i<items.length;i++){
  const item=items[i];
  if(item.classList.contains('blockTitle'))continue;
  const r=item.getBoundingClientRect();
  const y=Math.ceil(r.bottom-h.top+4);
  if(y>0&&y<el.scrollHeight)ends.push(y);
 }
 return [...new Set(ends)].sort((a,b)=>a-b);
}
async function capturePdfSection(element){
 return window.html2canvas(element,{scale:1.7,useCORS:true,backgroundColor:'#ffffff',
  scrollX:0,scrollY:0,windowWidth:1200,width:1000,
  height:Math.ceil(element.getBoundingClientRect().height),logging:false});
}
function addSectionPages(pdf,canvas,breaks,info,state){
 const pageW=297,pageH=210,left=13,right=13,top=15,bottom=16;
 const imageW=pageW-left-right;
 // Map CSS pixels to mm using the known 1000px export width.
 const cssToMm=imageW/1000,scale=canvas.width/1000;
 const usableCss=(pageH-top-bottom-4)/cssToMm;
 const totalCss=canvas.height/scale;
 let from=0,part=0;
 while(from<totalCss-0.5){
  if(state.pageCount>0)pdf.addPage('a4','landscape');
  state.pageCount++;
  let remaining=totalCss-from;
  let end=Math.min(totalCss,from+usableCss);
  if(remaining>usableCss+0.5){
   const possible=breaks.filter(y=>y>from+Math.min(95,usableCss*.2)&&y<=end-4);
   if(possible.length)end=possible[possible.length-1];
  }
  // Every new mission begins with its own first page; continuation pages repeat its ID.
  if(part>0){
   pdf.setFont('helvetica','bold');pdf.setFontSize(9);pdf.setTextColor(45,83,68);
   pdf.text(`${info.label}  /  SUITE`,left,10);
  }
  let sy=Math.round(from*scale),ey=Math.min(canvas.height,Math.round(end*scale));
  if(ey<=sy)ey=Math.min(canvas.height,sy+1);
  const piece=document.createElement('canvas');piece.width=canvas.width;piece.height=ey-sy;
  const ctx=piece.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,piece.width,piece.height);
  ctx.drawImage(canvas,0,sy,canvas.width,ey-sy,0,0,piece.width,piece.height);
  const drawH=(ey-sy)/scale*cssToMm;
  pdf.addImage(piece.toDataURL('image/jpeg',0.94),'JPEG',left,top,imageW,drawH,undefined,'FAST');
  state.pages.push({label:info.label,part:part+1});
  from=end;part++;
 }
}
$('printBtn').onclick=async()=>{
 const btn=$('printBtn');if(btn.disabled||!$('app').querySelector('.hero'))return;
 const old=btn.textContent;let stage;
 btn.disabled=true;btn.textContent='Pagination du rapport…';
 try{
  await loadPdfLibrary();if(document.fonts?.ready)await document.fonts.ready;
  const pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4',compress:true});
  const state={pageCount:0,pages:[]};
  stage=document.createElement('div');
  // Keep the render surface at x=0. Moving it off-screen caused the horizontal
  // cropping visible in the previous PDF; the negative z-index hides it instead.
  stage.style.cssText='position:fixed;left:0;top:0;width:1000px;z-index:-1000;pointer-events:none;background:white;';
  document.body.appendChild(stage);
  const source=document.querySelector('.wrap');
  for(const item of pdfSections(source)){
   stage.replaceChildren(item.node);
   await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
   const canvas=await capturePdfSection(item.node);
   addSectionPages(pdf,canvas,getBreaks(item.node),item,state);
  }
  for(let n=1;n<=state.pageCount;n++){
   pdf.setPage(n);pdf.setDrawColor(220,226,221);pdf.line(13,199,284,199);
   pdf.setTextColor(105,117,109);pdf.setFont('helvetica','normal');pdf.setFontSize(8);
   pdf.text('HOSPITALITY PERFORMANCE  /  RAPPORT CONSULTANT  /  USAGE INTERNE',13,204);
   pdf.text(`${n} / ${state.pageCount}`,284,204,{align:'right'});
  }
  pdf.save(reportPdfFilename());
 }catch(err){console.error('Export PDF paginé',err);alert('Le téléchargement du PDF a échoué : '+(err?.message||String(err)));}
 finally{stage?.remove();btn.disabled=false;btn.textContent=old;}
};

$("closeBtn").onclick=()=>window.close();
load().catch(err=>{
  console.error(err);
  $("app").className="";
  $("app").innerHTML=`<div class="empty"><h2>Erreur de chargement</h2><p>${esc(err.message||err)}</p></div>`;
});
</script>
