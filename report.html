<body>

<section id="loginView" class="login">

</section>

<main id="report" class="report hide"></main>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.116.0";
const sb=createClient("https://wztiaiwjprarpdzsudpx.supabase.co","sb_publishable_JqSGi4QEil2MBaI5tYsQvA_wQnxz8U_");
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const num=(v,d=0)=>v===null||v===undefined?"—":Number(v).toLocaleString("fr-FR",{minimumFractionDigits:d,maximumFractionDigits:d});
const euro=v=>v===null||v===undefined?"—":Number(v).toLocaleString("fr-FR",{maximumFractionDigits:0})+" €";
const dateFr=v=>{if(!v)return"—";const [y,m,d]=String(v).slice(0,10).split("-");return `${d}/${m}/${y}`};
const monthFr=v=>{if(!v)return"—";const d=new Date(String(v).slice(0,10)+"T12:00:00");return d.toLocaleDateString("fr-FR",{month:"short"}).replace(".","")};
let diagnostics=[],current=null;
$("printBtn").onclick=()=>window.print();
$("logoutBtn").onclick=async()=>{await sb.auth.signOut();location.reload()};
$("loginBtn").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error){$("loginMsg").textContent=error.message;return}showApp()};
$("diagSelect").onchange=async e=>{current=e.target.value;await loadReport()};

async function boot(){const {data:{session}}=await sb.auth.getSession();if(session)showApp()}
async function showApp(){
 $("loginView").classList.add("hide");$("appbar").classList.remove("hide");$("reportTabs").classList.remove("hide");$("report").classList.remove("hide");
 const {data,error}=await sb.from("hp_diagnostics").select("id,establishment_name,establishment_type,created_at").order("created_at",{ascending:false});
 if(error)return;diagnostics=data||[];$("diagSelect").innerHTML=diagnostics.map(d=>`<option value="${esc(d.id)}">${esc(d.establishment_name)}</option>`).join("");
 if(diagnostics.length){current=diagnostics[0].id;await loadReport()}
}
async function loadReport(){
 $("report").innerHTML='<section class="page"><p class="muted">Génération de la restitution…</p></section>';
 const [{data:d,error},{data:p},{data:plan},{data:monthly,error:monthlyError}]=await Promise.all([
  sb.from("hp_client_report_summary_v1").select("*").eq("diagnostic_id",current).maybeSingle(),
  sb.from("hp_prioritized_actions_v1").select("*").eq("diagnostic_id",current).order("blocked").order("action_rank"),
  sb.from("hp_action_plan_v1").select("*").eq("diagnostic_id",current),
  sb.from("hp_rh_monthly_analysis").select("month_start,revenue_ht,planned_hours,actual_hours,productivity_ht_per_hour,hours_variance_pct,active_days,partial_period").eq("diagnostic_id",current).order("month_start")
 ]);
 if(error||!d){$("report").innerHTML='<section class="page"><p>Rapport indisponible.</p></section>';return}
 render(d,p||[],plan||[],monthlyError?[]:(monthly||[]));
}
function page(n,content,cls=""){return `<section class="page ${cls}">${content}<div class="pageNo">${n}</div></section>`}
function niceMax(v){if(!Number.isFinite(v)||v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function revenueChart(rows){
 if(!rows.length)return '<div class="evidence">Série mensuelle non disponible.</div>';
 const W=620,H=142,L=46,R=12,T=18,B=27,vals=rows.map(r=>Number(r.revenue_ht)).filter(Number.isFinite),max=niceMax(Math.max(...vals)*1.08);
 const slot=(W-L-R)/rows.length,bw=Math.min(38,slot*.56);
 const grid=[0,.25,.5,.75,1].map(t=>{const yy=T+(H-T-B)*t,val=max*(1-t);return `<line class="grid" x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}"/><text x="${L-6}" y="${yy+3}" text-anchor="end">${Math.round(val/1000)}k</text>`}).join("");
 const bars=rows.map((r,i)=>{const v=Number(r.revenue_ht)||0,h=(H-T-B)*(v/max),xx=L+i*slot+(slot-bw)/2,yy=H-B-h;return `<rect class="${r.partial_period?"partial":"bar"}" x="${xx}" y="${yy}" width="${bw}" height="${h}" rx="3"/><text class="valueLabel" x="${xx+bw/2}" y="${Math.max(10,yy-4)}" text-anchor="middle">${Math.round(v/1000)}k</text><text x="${xx+bw/2}" y="${H-8}" text-anchor="middle">${monthFr(r.month_start)}${r.partial_period?"*":""}</text>`}).join("");
 return `<svg class="svgChart" viewBox="0 0 ${W} ${H}" role="img">${grid}<line class="axis" x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}"/>${bars}</svg>`;
}
function productivityChart(rows){
 if(!rows.length)return '<div class="evidence">Série mensuelle non disponible.</div>';
 const W=300,H=137,L=34,R=10,T=17,B=25,vals=rows.map(r=>Number(r.productivity_ht_per_hour)).filter(Number.isFinite),max=niceMax(Math.max(...vals)*1.08),avg=vals.reduce((a,b)=>a+b,0)/vals.length;
 const x=i=>L+(W-L-R)*(rows.length===1?.5:i/(rows.length-1)), y=v=>T+(H-T-B)*(1-Number(v)/max);
 const grid=[0,.5,1].map(t=>{const yy=T+(H-T-B)*t,val=max*(1-t);return `<line class="grid" x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}"/><text x="${L-5}" y="${yy+3}" text-anchor="end">${Math.round(val)}</text>`}).join("");
 const pts=rows.map((r,i)=>`${x(i)},${y(r.productivity_ht_per_hour)}`).join(" ");
 const labels=rows.map((r,i)=>`<text x="${x(i)}" y="${H-7}" text-anchor="middle">${monthFr(r.month_start)}${r.partial_period?"*":""}</text>`).join("");
 const points=rows.map((r,i)=>`<circle class="point" cx="${x(i)}" cy="${y(r.productivity_ht_per_hour)}" r="2.7"/>`).join("");
 const ay=y(avg);
 return `<svg class="svgChart" viewBox="0 0 ${W} ${H}" role="img">${grid}<line class="avgLine" x1="${L}" y1="${ay}" x2="${W-R}" y2="${ay}"/><text class="avgLabel" x="${W-R}" y="${ay-4}" text-anchor="end">moy. ${num(avg,1)}</text><polyline class="line" points="${pts}"/>${points}${labels}</svg>`;
}
function hoursChart(rows){
 if(!rows.length)return '<div class="evidence">Série mensuelle non disponible.</div>';
 const W=300,H=137,L=35,R=8,T=17,B=25,vals=rows.flatMap(r=>[Number(r.planned_hours),Number(r.actual_hours)]).filter(Number.isFinite),max=niceMax(Math.max(...vals)*1.08);
 const slot=(W-L-R)/rows.length,bw=Math.min(9,slot*.28),group=bw*2+2;
 const grid=[0,.5,1].map(t=>{const yy=T+(H-T-B)*t,val=max*(1-t);return `<line class="grid" x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}"/><text x="${L-5}" y="${yy+3}" text-anchor="end">${Math.round(val)}</text>`}).join("");
 const bars=rows.map((r,i)=>{const cx=L+i*slot+slot/2, pv=Number(r.planned_hours)||0,av=Number(r.actual_hours)||0,ph=(H-T-B)*(pv/max),ah=(H-T-B)*(av/max),px=cx-group/2,ax=px+bw+2;return `<rect class="plannedBar" x="${px}" y="${H-B-ph}" width="${bw}" height="${ph}" rx="2"/><rect class="actualBar" x="${ax}" y="${H-B-ah}" width="${bw}" height="${ah}" rx="2"/><text x="${cx}" y="${H-7}" text-anchor="middle">${monthFr(r.month_start)}${r.partial_period?"*":""}</text>`}).join("");
 return `<svg class="svgChart" viewBox="0 0 ${W} ${H}" role="img">${grid}<line class="axis" x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}"/>${bars}</svg><div class="chartLegend"><span><i class="legendDot legendPlanned"></i>Planifiées</span><span><i class="legendDot legendActual"></i>Réelles</span></div>`;
}
function render(d,priorities,plan,monthly){
 const score=d.hp_score_final!==null?Number(d.hp_score_final):Number(d.preliminary_score||0);
 const dims=Array.isArray(d.dimension_scores)?d.dimension_scores:[];
 const cov=Array.isArray(d.client_coverage)?d.client_coverage:[];
 const insights=Array.isArray(d.client_insights)?d.client_insights:[];
 const actionable=priorities.filter(x=>!x.blocked&&Number(x.action_rank)<=4);
 const blocked=priorities.filter(x=>x.blocked);
 const reportDate=new Date().toLocaleDateString("fr-FR");
 const insightByCode=Object.fromEntries(insights.map(i=>[i.code,i]));
 const bestDim=[...dims].sort((a,b)=>(Number(b.score)/Math.max(1,Number(b.max_score)))-(Number(a.score)/Math.max(1,Number(a.max_score))))[0];
 const valid=Number(d.source_validated||0),total=Number(d.source_total||0),filled=Number(d.source_filled||0);
 const fullMonths=monthly.filter(x=>!x.partial_period);
 const revPeak=(fullMonths.length?fullMonths:monthly).reduce((a,b)=>!a||Number(b.revenue_ht)>Number(a.revenue_ht)?b:a,null);
 const prodPeak=(fullMonths.length?fullMonths:monthly).reduce((a,b)=>!a||Number(b.productivity_ht_per_hour)>Number(a.productivity_ht_per_hour)?b:a,null);
 const hoursGap=monthly.reduce((s,x)=>s+(Number(x.actual_hours||0)-Number(x.planned_hours||0)),0);
 let pages=[];

 pages.push(page(1,`<div class="coverHero">
 <div class="coverBrand"><div class="coverBrandMark">HP</div><div class="coverBrandText"><b>Hospitality Performance</b><span>Piloter · Analyser · Performer</span></div></div>
 <div class="coverMain"><div><div class="eyebrow">Rapport de diagnostic · ${reportDate}</div><h1>${esc(d.establishment_name)}</h1><p class="lead">Analyse de la performance commerciale, opérationnelle, humaine et digitale. Une restitution conçue pour transformer les données disponibles en priorités d'action.</p></div>
 <div class="coverScore"><div class="coverScoreRing" style="--cover-angle:${score*3.6}deg"><div class="coverScoreInner"><b>${num(score)}</b><span>HP Score${d.hp_score_final===null?" provisoire":""}</span></div></div></div></div>
 <div class="coverStats"><div class="coverStat"><b>${num(d.score_coverage_pct)} %</b><span>Scoring documenté</span></div><div class="coverStat"><b>${valid}/${total}</b><span>Sources économiques validées</span></div><div class="coverStat"><b>${num(actionable.length)}</b><span>Priorités actives</span></div></div></div>
 <div class="coverBottom"><div><div class="eyebrow">Profil du diagnostic</div>${dims.map(x=>{const pct=Number(x.score||0)/Math.max(1,Number(x.max_score||20))*100;return `<div class="coverPillar"><span>${esc(x.dimension)}</span><div class="track"><div class="fill" style="width:${Math.min(100,pct)}%"></div></div><b>${num(x.score)}/${num(x.max_score)}</b></div>`}).join("")}</div>
 <div><div class="coverRightVisual"><div class="coverProofRing" style="--proof-angle:${Math.max(0,Math.min(100,Number(d.validated_data_pct||0)))*3.6}deg"><div><b>${num(d.validated_data_pct)}%</b><span>validé</span></div></div><div class="coverProofText"><b>Niveau de preuve économique</b><span>${valid}/${total} sources attendues sont actuellement validées.</span></div></div><div class="eyebrow">3 priorités de départ</div>${actionable.slice(0,3).map((p,i)=>`<div class="coverPriority"><b>${i+1}. ${esc(p.title)}</b><span>${esc(p.service_area)}</span></div>`).join("")}</div></div>
 <div class="coverMeta"><div><b>Méthodologie</b>Hospitality Performance · HP V2.5</div><div><b>Périmètre</b>Commercial · RH · Exploitation · Données</div><div><b>Statut</b>${d.hp_score_final===null?"Diagnostic en cours de consolidation":"Diagnostic consolidé"}</div><div><b>État de la preuve</b>${num(d.validated_data_pct)} % des données économiques attendues validées</div></div>`,"cover"));

 pages.push(page(2,`<div class="eyebrow">01 · Synthèse exécutive</div><h2>La situation en un regard</h2>
 <div class="reportHero"><div class="eyebrow">HP Score</div><div style="display:grid;grid-template-columns:105px 1fr;gap:18px;align-items:center"><div class="scoreRing" style="--score-angle:${score*3.6}deg;background:conic-gradient(#fff ${score*3.6}deg,rgba(255,255,255,.18) 0)!important"><div class="scoreRingInner"><b style="color:#103833">${num(score)}</b><span>/100${d.hp_score_final===null?"*":""}</span></div></div><div><h2 style="margin:0 0 6px">${d.hp_score_final===null?"Score provisoire":"Score consolidé"}</h2><p style="font-size:10px;line-height:1.5;margin:0">${num(d.score_coverage_pct)} % des critères HP sont documentés. Le score mesure le niveau de structuration observé, pas la rentabilité de l’établissement.</p></div></div></div>
 <div class="visualKpis"><div class="visualKpi accent"><div class="v">${num(d.validated_data_pct)} %</div><div class="l">Sources économiques validées</div></div><div class="visualKpi"><div class="v">${num(d.insight_count)}</div><div class="l">Constats structurés</div></div><div class="visualKpi gold"><div class="v">${num(actionable.length)}</div><div class="l">Priorités actives</div></div><div class="visualKpi"><div class="v">${num(d.actions_30)}</div><div class="l">Actions prévues à 30 jours</div></div></div>
 <h3>Score par pilier</h3><div class="dimensionCards">${dims.map(x=>{const pct=Number(x.score||0)/Math.max(1,Number(x.max_score||20))*100;return `<div class="dimensionCard"><b>${num(x.score)}/${num(x.max_score)}</b><span>${esc(x.dimension)}</span><div class="track"><div class="fill" style="width:${Math.min(100,pct)}%"></div></div></div>`}).join("")}</div>
 <div class="visualPanel"><h3>Lecture exécutive</h3><p class="small muted" style="margin:0">Le diagnostic fait ressortir en priorité la structuration du processus commercial et la consolidation des données. Les contrôles RH et d’exploitation complètent cette lecture. Aucun gain financier n’est affiché sans cible ou coût documenté.</p></div>`));

 pages.push(page(3,`<div class="eyebrow">02 · Diagnostic</div><h2>Forces, fragilités et fiabilité des données</h2>
 <div class="visualGrid"><div><h3>Constats prioritaires</h3>${insights.slice(0,3).map((i,idx)=>`<div class="insightCard"><div class="insightIcon ${i.priority==="Haute"?"high":""}">${idx+1}</div><div><h3>${esc(i.title)}</h3><p>${esc(i.finding)}</p><p class="consequence"><b>Conséquence :</b> ${esc(i.consequence)}</p></div></div>`).join("")}</div>
 <div><h3>Fiabilité par domaine</h3><div class="coverageGrid">${cov.map(x=>`<div class="coverageCard"><div class="coverageCardTop"><b>${esc(x.area)}</b><span>${num(x.validated_pct)} %</span></div><div class="track"><div class="fill" style="width:${Math.min(100,Number(x.validated_pct||0))}%"></div></div><small>${num(x.source_validated)}/${num(x.source_total)} sources validées · ${esc(x.status)}</small></div>`).join("")}</div>
 <div class="visualKpis" style="grid-template-columns:1fr 1fr;margin-top:9px"><div class="visualKpi"><div class="v">${filled}/${total}</div><div class="l">Sources renseignées</div></div><div class="visualKpi accent"><div class="v">${valid}/${total}</div><div class="l">Sources validées</div></div></div></div></div>
 <p class="footerNote">Une zone peu documentée reste à qualifier ; elle n’est pas considérée comme performante ou défaillante.</p>`));

 const figs=[];
 if(d.revenue_ht_common_period!==null) figs.push(["CA HT documenté",euro(d.revenue_ht_common_period),`${dateFr(d.period_start)} → ${dateFr(d.period_end)}`]);
 if(d.avg_payment_per_ticket!==null) figs.push(["Encaissement moyen / ticket payé",euro(d.avg_payment_per_ticket),`${num(d.paid_tickets)} tickets avec paiement`]);
 if(d.rh_productivity_ht_per_hour!==null) figs.push(["Productivité RH",num(d.rh_productivity_ht_per_hour,2)+" € HT/h",`${dateFr(d.rh_period_start)} → ${dateFr(d.rh_period_end)}`]);
 if(d.hours_variance_pct!==null) figs.push(["Heures réelles vs planifiées",num(d.hours_variance_pct,1)+" %",`${num(d.tension_signal_count)} signaux de tension potentielle`]);
 pages.push(page(4,`<div class="eyebrow">03 · Performance documentée</div><h2>Les chiffres qui structurent l'analyse</h2>
 <div class="visualKpis">${figs.map((f,i)=>`<div class="visualKpi ${i===0?"accent":i===3?"gold":""}"><div class="v">${esc(f[1])}</div><div class="l">${esc(f[0])}<br>${esc(f[2])}</div></div>`).join("")}</div>
 <div class="performanceCharts">
  <div class="chartBox full"><div class="chartHead"><h3>Chiffre d'affaires HT mensuel</h3><span>Lecture en k€ · source Combo · * période partielle</span></div>${revenueChart(monthly)}</div>
  <div class="chartDuo">
   <div class="chartBox"><div class="chartHead"><h3>Productivité RH</h3><span>€ HT / heure réelle</span></div>${productivityChart(monthly)}</div>
   <div class="chartBox"><div class="chartHead"><h3>Heures planifiées vs réelles</h3><span>Volume mensuel d'heures</span></div>${hoursChart(monthly)}</div>
  </div>
 </div>
 <div class="chartTakeaways">
  <div class="chartTakeaway"><b>${revPeak?euro(revPeak.revenue_ht):"—"}</b><span>Pic mensuel documenté · ${revPeak?monthFr(revPeak.month_start):"—"}</span></div>
  <div class="chartTakeaway"><b>${prodPeak?num(prodPeak.productivity_ht_per_hour,1)+" € HT/h":"—"}</b><span>Productivité mensuelle la plus élevée · ${prodPeak?monthFr(prodPeak.month_start):"—"}</span></div>
  <div class="chartTakeaway"><b>${num(hoursGap,0)} h</b><span>Écart cumulé réel - planifié sur la période · indicateur de contrôle</span></div>
 </div>
 <p class="performanceNote">Les graphiques décrivent les données disponibles. Ils ne constituent pas, à eux seuls, une estimation de gain ou de sous-effectif.</p>
 <div class="warning" style="margin-top:7px"><b>Potentiel économique :</b> ${esc(d.economic_value_status)}</div>`,"printBreak"));

 pages.push(page(5,`<div class="eyebrow">04 · Priorisation</div><h2>Les leviers à traiter en premier</h2>
 <div class="priorityGrid">${actionable.map(p=>{const ins=insightByCode[p.insight_code]||insightByCode[p.code]||{};return `<div class="priorityCard"><div class="priorityRank">${num(p.action_rank)}</div><div><h3>${esc(p.title)}</h3><div class="priorityMeta">${esc(p.service_area)} · ${esc(p.quadrant)}</div><div class="priorityWhy">${esc(ins.consequence||ins.finding||"Priorité issue de la matrice Impact × Effort HP.")}</div><div class="priorityAction"><b>Orientation :</b> ${esc(p.recommended_action||ins.action||"Traiter ce levier selon la feuille de route 30 / 60 / 90 jours.")}</div></div></div>`}).join("")}</div>
 ${blocked.length?`<div class="warning"><b>Prérequis :</b> ${blocked.map(x=>esc(x.title)).join(", ")} reste bloqué par une donnée source manquante.</div>`:""}
 <p class="footerNote">Le classement est issu de la matrice Impact × Effort interne HP. Le rapport client conserve le rang et la catégorie d'action sans exposer les coefficients techniques.</p>`,"printBreak"));

 const phases=[["0-30","0–30 jours","Cadrer & sécuriser"],["31-60","31–60 jours","Mesurer & tester"],["61-90","61–90 jours","Stabiliser & piloter"]];
 pages.push(page(6,`<div class="eyebrow">05 · Feuille de route</div><h2>90 jours pour transformer le diagnostic en actions</h2>
 <div class="roadmap roadmapCompact">${phases.map(([code,label,sub])=>{const items=plan.filter(a=>!a.blocked&&a.phase_days===code).sort((a,b)=>(Number(a.action_rank)-Number(b.action_rank))||(Number(a.action_order)-Number(b.action_order)));return `<div class="roadmapCol"><div class="roadmapHead"><b>${label}</b><span>${sub}</span></div><div class="roadmapBody">${items.map(a=>`<div class="roadmapAction"><b>${esc(a.service_area)}</b><p>${esc(a.action)}</p></div>`).join("")||'<div class="roadmapAction"><p>Aucune action.</p></div>'}</div></div>`}).join("")}</div>
 <div class="visualKpis"><div class="visualKpi accent"><div class="v">${num(d.actions_30)}</div><div class="l">Actions 0–30 jours</div></div><div class="visualKpi"><div class="v">${num(d.actions_60)}</div><div class="l">Actions 31–60 jours</div></div><div class="visualKpi"><div class="v">${num(d.actions_90)}</div><div class="l">Actions 61–90 jours</div></div><div class="visualKpi gold"><div class="v">${num(Number(d.actions_30||0)+Number(d.actions_60||0)+Number(d.actions_90||0))}</div><div class="l">Actions planifiées au total</div></div></div>
 <div class="visualPanel"><h3>Principe de pilotage</h3><p class="small muted" style="margin:0">Chaque étape doit produire une preuve exploitable : procédure, mesure, comparaison ou indicateur. La feuille de route ne suppose pas de gain économique avant validation des données nécessaires.</p></div><p class="footerNote" style="margin-top:8px">Méthode HP V2 · Aucun benchmark non comparable ni gain économique sans cible ou coût documenté. Rapport généré à partir des données disponibles au ${reportDate}.</p>`));



 $("report").innerHTML=pages.join("");
}
boot();
</script>
