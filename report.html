<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Restitution HP Diagnostic | Hospitality Performance</title>
<style>
:root{--navy:#10283f;--teal:#1f8a86;--ink:#172330;--muted:#667684;--line:#dce5e9;--soft:#f4f7f8;--warn:#9a6500}
*{box-sizing:border-box}body{margin:0;background:#e9eef0;color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}.hide{display:none!important}.appbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.brand{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.controls select{padding:8px 10px;border:0;border-radius:8px;min-width:220px}.btn{border:0;border-radius:8px;padding:8px 11px;font-weight:800;cursor:pointer;text-decoration:none}.btnLight{background:#edf2f4;color:var(--navy)}.btnTeal{background:var(--teal);color:#fff}
.login{max-width:430px;margin:70px auto;background:#fff;border-radius:16px;padding:25px}.login h1{margin:0 0 8px;color:var(--navy)}.field{margin:13px 0}.field label{display:block;font-size:11px;font-weight:850;color:var(--muted);margin-bottom:5px}.field input{width:100%;padding:10px;border:1px solid #cbd7dc;border-radius:8px}.msg{font-size:12px;color:#a83232;margin-top:9px}
.report{width:min(210mm,calc(100% - 24px));margin:20px auto}.page{background:#fff;min-height:277mm;padding:18mm 17mm;margin:0 auto 18px;box-shadow:0 8px 30px rgba(16,40,63,.08);position:relative;overflow:hidden}.pageNo{position:absolute;right:17mm;bottom:10mm;font-size:9px;color:#8b98a2}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:900;color:var(--teal)}h1,h2,h3{color:var(--navy)}h1{font-size:38px;line-height:1.06;margin:8px 0 12px}h2{font-size:24px;margin:6px 0 14px}h3{font-size:14px;margin:0 0 6px}.lead{font-size:16px;line-height:1.55;color:#405260}.muted{color:var(--muted)}.small{font-size:10px;line-height:1.45}.rule{height:1px;background:var(--line);margin:16px 0}.cover{display:flex;flex-direction:column;justify-content:space-between}.coverTop{margin-top:25mm}.coverMark{width:54px;height:7px;background:var(--teal);border-radius:99px;margin-bottom:24px}.coverMeta{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--line);padding-top:16px}.coverMeta b{display:block;font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em;margin-bottom:5px}.scoreHero{display:grid;grid-template-columns:140px 1fr;gap:22px;align-items:center;margin:20px 0}.scoreRing{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--teal) var(--score-angle,0deg),#e8eef0 0);position:relative}.scoreRing:after{content:"";position:absolute;inset:11px;background:#fff;border-radius:50%}.scoreRingInner{position:relative;z-index:1;text-align:center}.scoreRingInner b{display:block;font-size:31px;color:var(--navy)}.scoreRingInner span{font-size:9px;color:var(--muted);font-weight:850}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.kpi{border:1px solid var(--line);border-radius:11px;padding:12px}.kpi b{display:block;color:var(--navy);font-size:21px}.kpi span{font-size:9px;color:var(--muted);line-height:1.35}.dim{display:grid;grid-template-columns:105px 1fr 42px;gap:8px;align-items:center;margin:10px 0;font-size:11px}.track{height:7px;background:#edf1f3;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--teal);border-radius:99px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{border:1px solid var(--line);border-radius:11px;padding:12px}.insight{padding:12px 0;border-top:1px solid var(--line)}.insight:first-child{border-top:0}.insightTop{display:flex;justify-content:space-between;gap:10px}.pill{font-size:9px;font-weight:850;padding:4px 7px;border-radius:99px;background:#eef2f4;color:#52616d;white-space:nowrap}.pill.high{background:#faeaea;color:#9d3232}.pill.medium{background:#fff3d9;color:#8b5b00}.insight p,.action p{font-size:10px;line-height:1.48;margin:5px 0;color:#52616d}.evidence{font-size:9px;line-height:1.45;background:#f7f9fa;border-radius:8px;padding:8px;margin-top:7px;color:#687985}.priority{display:grid;grid-template-columns:28px 1fr auto;gap:9px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.priority:first-child{border-top:0}.rank{width:26px;height:26px;border-radius:7px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:900}.priority h3{font-size:12px}.scores{font-size:9px;color:var(--muted);text-align:right}.figures{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.figure{padding:12px;border:1px solid var(--line);border-radius:10px}.figure b{display:block;font-size:18px;color:var(--navy)}.figure span{font-size:9px;color:var(--muted)}.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.phase{border-top:4px solid var(--teal);background:#f7f9fa;padding:12px;border-radius:0 0 10px 10px}.phase h3{font-size:13px}.action{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px;margin-top:8px}.action b{font-size:10px;color:var(--navy)}.warning{background:#fff7e5;border:1px solid #f0dfb8;border-radius:9px;padding:10px;font-size:10px;line-height:1.5;color:#72521a}.coverage{margin:8px 0}.coverageTop{display:flex;justify-content:space-between;gap:8px;font-size:9px;margin-bottom:4px}.footerNote{font-size:9px;line-height:1.5;color:var(--muted)}
@media(max-width:760px){.report{width:calc(100% - 12px)}.page{min-height:auto;padding:22px 18px}.scoreHero,.grid2,.timeline,.coverMeta{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.appbar{align-items:flex-start}.controls{justify-content:flex-end}.controls select{min-width:150px}}
@media print{
 @page{size:A4;margin:0}
 body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .appbar,.login{display:none!important}.report{width:210mm;margin:0}.page{width:210mm;height:297mm;min-height:297mm;margin:0;box-shadow:none;page-break-after:always;break-after:page}.page:last-child{page-break-after:auto}
}
</style>
</head>
<body>
<header id="appbar" class="appbar hide">
 <div><div class="brand">Hospitality Performance</div><div style="font-size:10px;opacity:.7">Restitution client</div></div>
 <div class="controls"><select id="diagSelect"></select><a href="dashboard.html" class="btn btnLight">Dashboard</a><button id="printBtn" class="btn btnTeal">Exporter en PDF</button><button id="logoutBtn" class="btn btnLight">Déconnexion</button></div>
</header>

<section id="loginView" class="login">
 <h1>Restitution HP</h1><p class="muted small">Accès interne. Le rapport généré peut ensuite être exporté en PDF.</p>
 <div class="field"><label>Email</label><input id="email" type="email"></div>
 <div class="field"><label>Mot de passe</label><input id="password" type="password"></div>
 <button id="loginBtn" class="btn btnTeal" style="width:100%">Se connecter</button><div id="loginMsg" class="msg"></div>
</section>

<main id="report" class="report hide"></main>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.116.0";
const sb=createClient("https://wztiaiwjprarpdzsudpx.supabase.co","sb_publishable_JqSGi4QEil2MBaI5tYsQvA_wQnxz8U_");
const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const num=(v,d=0)=>v===null||v===undefined?"—":Number(v).toLocaleString("fr-FR",{minimumFractionDigits:d,maximumFractionDigits:d});
const euro=v=>v===null||v===undefined?"—":Number(v).toLocaleString("fr-FR",{maximumFractionDigits:0})+" €";
const dateFr=v=>{if(!v)return"—";const [y,m,d]=String(v).split("-");return `${d}/${m}/${y}`};
let diagnostics=[],current=null;
$("printBtn").onclick=()=>window.print();
$("logoutBtn").onclick=async()=>{await sb.auth.signOut();location.reload()};
$("loginBtn").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error){$("loginMsg").textContent=error.message;return}showApp()};
$("diagSelect").onchange=async e=>{current=e.target.value;await loadReport()};

async function boot(){const {data:{session}}=await sb.auth.getSession();if(session)showApp()}
async function showApp(){
 $("loginView").classList.add("hide");$("appbar").classList.remove("hide");$("report").classList.remove("hide");
 const {data,error}=await sb.from("hp_diagnostics").select("id,establishment_name,establishment_type,created_at").order("created_at",{ascending:false});
 if(error)return;diagnostics=data||[];$("diagSelect").innerHTML=diagnostics.map(d=>`<option value="${esc(d.id)}">${esc(d.establishment_name)}</option>`).join("");
 if(diagnostics.length){current=diagnostics[0].id;await loadReport()}
}
async function loadReport(){
 const [{data:d,error},{data:p},{data:plan}]=await Promise.all([
  sb.from("hp_client_report_summary_v1").select("*").eq("diagnostic_id",current).maybeSingle(),
  sb.from("hp_prioritized_actions_v1").select("*").eq("diagnostic_id",current).order("blocked").order("action_rank"),
  sb.from("hp_action_plan_v1").select("*").eq("diagnostic_id",current)
 ]);
 if(error||!d){$("report").innerHTML='<div class="page"><p>Rapport indisponible.</p></div>';return}
 render(d,p||[],plan||[]);
}
function page(n,content,cls=""){return `<section class="page ${cls}">${content}<div class="pageNo">${n}</div></section>`}
function render(d,priorities,plan){
 const score=d.hp_score_final!==null?Number(d.hp_score_final):Number(d.preliminary_score||0);
 const dims=Array.isArray(d.dimension_scores)?d.dimension_scores:[];
 const cov=Array.isArray(d.client_coverage)?d.client_coverage:[];
 const insights=Array.isArray(d.client_insights)?d.client_insights:[];
 const actionable=priorities.filter(x=>!x.blocked&&Number(x.action_rank)<=4);
 const blocked=priorities.filter(x=>x.blocked);
 const totalPlan=Number(d.actions_30||0)+Number(d.actions_60||0)+Number(d.actions_90||0);
 const reportDate=new Date().toLocaleDateString("fr-FR");
 let pages=[];

 pages.push(page(1,`<div class="coverTop"><div class="coverMark"></div><div class="eyebrow">HP Diagnostic · Restitution</div><h1>${esc(d.establishment_name)}</h1><p class="lead">Diagnostic de performance commerciale, opérationnelle et digitale.</p></div>
 <div class="coverMeta"><div><b>Date de restitution</b>${reportDate}</div><div><b>Méthodologie</b>Hospitality Performance · HP V1.1</div><div><b>Scoring</b>${num(d.score_coverage_pct)} % des critères renseignés</div><div><b>Sources économiques validées</b>${num(d.validated_data_pct)} %</div></div>`,"cover"));

 pages.push(page(2,`<div class="eyebrow">01 · Synthèse exécutive</div><h2>Lecture du diagnostic</h2>
 <div class="scoreHero"><div class="scoreRing" style="--score-angle:${Math.max(0,Math.min(100,score))*3.6}deg"><div class="scoreRingInner"><b>${num(score)}</b><span>${d.hp_score_final!==null?"HP SCORE":"SCORE PROVISOIRE"}</span></div></div>
 <div><h3>${d.hp_score_final!==null?"HP Score final":"Score encore provisoire"}</h3><p class="lead">${d.hp_score_final!==null?"Les 20 critères sont validés.":`${num(d.score_coverage_pct)} % du scoring est renseigné. Les critères restants doivent être confirmés avant de figer le HP Score.`}</p></div></div>
 <div class="kpis"><div class="kpi"><b>${num(d.validated_data_pct)} %</b><span>Sources économiques validées</span></div><div class="kpi"><b>${num(d.insight_count)}</b><span>Insights générés</span></div><div class="kpi"><b>${num(actionable.length)}</b><span>Priorités actives</span></div></div>
 <div class="box" style="margin:14px 0"><h3>Lecture en une phrase</h3><p class="small muted" style="margin:0">Le diagnostic met d’abord en évidence un besoin de structuration commerciale et de consolidation des données, complété par des contrôles ciblés sur la planification RH et le rapprochement des sources d’exploitation. Les gains économiques ne sont pas chiffrés tant que les données nécessaires ne permettent pas de les démontrer.</p></div>
 <div class="rule"></div><h3>Score par dimension</h3>${dims.map(x=>`<div class="dim"><span>${esc(x.dimension)}</span><div class="track"><div class="fill" style="width:${Math.min(100,Number(x.score||0)/Math.max(1,Number(x.max_score||20))*100)}%"></div></div><b>${num(x.score)}/${num(x.max_score)}</b></div>`).join("")}
 <div class="warning"><b>Règle de lecture :</b> le score mesure la structuration des pratiques observées. Il ne constitue pas à lui seul une mesure de rentabilité ou de qualité opérationnelle.</div>`));

 pages.push(page(3,`<div class="eyebrow">02 · Constats</div><h2>Constats décisifs</h2>
 ${insights.slice(0,5).map(i=>`<div class="insight"><div class="insightTop"><h3>${esc(i.title)}</h3><span class="pill ${i.priority==="Haute"?"high":"medium"}">${esc(i.priority)}</span></div><p><b>${esc(i.area)}</b> · ${esc(i.finding)}</p><div class="evidence"><b>Conséquence :</b> ${esc(i.consequence)}</div></div>`).join("")}
 <div class="rule"></div><h3>Fiabilité des données économiques</h3>${cov.map(x=>`<div class="coverage"><div class="coverageTop"><b>${esc(x.area)}</b><span>${esc(x.status)} · ${num(x.source_validated)}/${num(x.source_total)} sources validées</span></div><div class="track"><div class="fill" style="width:${Math.min(100,Number(x.validated_pct||0))}%"></div></div></div>`).join("")}
 <p class="footerNote">Disponibilité globale : ${num(d.data_availability_pct)} % · Sources validées : ${num(d.validated_data_pct)} %. Une donnée déclarée mais non validée n’a pas le même poids qu’une donnée issue d’un document ou d’un système vérifié.</p>`));

 const figs=[];
 if(d.revenue_ht_common_period!==null) figs.push(["CA HT documenté",euro(d.revenue_ht_common_period),`${dateFr(d.period_start)} → ${dateFr(d.period_end)}`]);
 if(d.paid_tickets!==null) figs.push(["Encaissement moyen / ticket payé",euro(d.avg_payment_per_ticket),`${num(d.paid_tickets)} tickets avec paiement`]);
 if(d.rh_productivity_ht_per_hour!==null) figs.push(["Productivité RH",num(d.rh_productivity_ht_per_hour,2)+" € HT/h",`${dateFr(d.rh_period_start)} → ${dateFr(d.rh_period_end)}`]);
 if(d.hours_variance_pct!==null) figs.push(["Heures réelles vs planifiées",num(d.hours_variance_pct,1)+" %",`${num(d.tension_signal_count)} signaux de tension potentielle · pas une économie`]);
 pages.push(page(4,`<div class="eyebrow">03 · Performance documentée</div><h2>Chiffres établis</h2><div class="figures">${figs.map(f=>`<div class="figure"><b>${esc(f[1])}</b><span>${esc(f[0])}<br>${esc(f[2])}</span></div>`).join("")}</div>
 <div class="rule"></div><h3>Interprétation</h3><p class="lead">Ces indicateurs proviennent des sources disponibles et sont présentés sur leurs périodes respectives. Ils servent à objectiver le diagnostic, sans extrapolation automatique vers une économie ou un manque à gagner.</p>
 <div class="warning"><b>Potentiel économique :</b> ${esc(d.economic_value_status)}</div>
 <div class="rule"></div><p class="footerNote"><b>Important :</b> les encaissements caisse et le CA HT Combo reposent sur des bases différentes. Leur écart est utilisé comme contrôle de rapprochement et non comme mesure d’une perte économique.</p>`));

 pages.push(page(5,`<div class="eyebrow">04 · Priorisation</div><h2>Top priorités</h2>
 ${actionable.map(p=>`<div class="priority"><div class="rank">${num(p.action_rank)}</div><div><h3>${esc(p.title)}</h3><p class="small muted" style="margin:3px 0">${esc(p.service_area)}</p></div><div class="scores"><span class="pill">${esc(p.quadrant)}</span></div></div>`).join("")}
 <div class="rule"></div><p class="lead">Les priorités sont ordonnées à partir d’une matrice Impact × Effort interne à la méthode HP. Le rapport client présente le rang et la catégorie d’action ; le détail des coefficients reste un outil de travail du consultant.</p>
 ${blocked.length?`<div class="warning"><b>Prérequis hors classement :</b> ${blocked.map(x=>esc(x.title)).join(", ")}.</div>`:""}`));

 const phases=[["0-30","0–30 jours"],["31-60","31–60 jours"],["61-90","61–90 jours"]];
 pages.push(page(6,`<div class="eyebrow">05 · Feuille de route</div><h2>Plan 30 / 60 / 90 jours</h2><div class="timeline">${phases.map(([code,label])=>{const items=plan.filter(a=>!a.blocked&&a.phase_days===code).sort((a,b)=>(Number(a.action_rank)-Number(b.action_rank))||(Number(a.action_order)-Number(b.action_order)));return `<div class="phase"><h3>${label}</h3>${items.map(a=>`<div class="action"><b>${esc(a.service_area)}</b><p>${esc(a.action)}</p></div>`).join("")||'<p class="small muted">Aucune action.</p>'}</div>`}).join("")}</div>
 <div class="rule"></div><div class="kpis"><div class="kpi"><b>${num(d.actions_30)}</b><span>actions à 30 jours</span></div><div class="kpi"><b>${num(d.actions_60)}</b><span>actions à 60 jours</span></div><div class="kpi"><b>${num(d.actions_90)}</b><span>actions à 90 jours</span></div></div>`));

 pages.push(page(7,`<div class="eyebrow">06 · Méthode & limites</div><h2>Cadre d’interprétation</h2>
 <div class="grid2"><div class="box"><h3>Ce que le diagnostic établit</h3><p class="small muted">Le niveau de structuration des 20 critères HP, les indicateurs documentés par les sources disponibles, les signaux détectés par les règles HP et une priorisation des actions.</p></div>
 <div class="box"><h3>Ce qu’il ne suppose pas</h3><p class="small muted">Aucun benchmark non comparable, aucune économie sans coût ou cible documentée, aucun manque à gagner déduit d’un simple écart de source, aucune conclusion de sous-effectif fondée uniquement sur la productivité.</p></div></div>
 <div class="rule"></div><h3>Limites actuelles</h3>
 <div class="insight"><p>${100-Number(d.score_coverage_pct||0)} % du scoring reste à confirmer.</p></div>
 <div class="insight"><p>${num(d.validated_data_pct)} % des sources économiques attendues sont actuellement validées (${num(d.source_validated)}/${num(d.source_total)}). La disponibilité brute des données est de ${num(d.data_availability_pct)} %.</p></div>
 ${blocked.map(x=>`<div class="insight"><p>${esc(x.title)} : prérequis bloqué par une donnée source manquante.</p></div>`).join("")}
 <div class="rule"></div><p class="footerNote">Hospitality Performance · Diagnostic V1.1 · Rapport généré à partir des données disponibles au ${reportDate}. Les recommandations doivent être confrontées au contexte terrain avant mise en œuvre.</p>`));

 $("report").innerHTML=pages.join("");
}
boot();
</script>
</body>
</html>
