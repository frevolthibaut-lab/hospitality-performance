async function savePdf(){
  const btn=$("printBtn"),state=$("pdfState");
  const JsPDF=window.jspdf?.jsPDF;
  if(typeof window.html2canvas!=="function"||!JsPDF){
    state.textContent="Générateur PDF indisponible.";
    return;
  }

  btn.disabled=true;
  document.body.classList.add("pdfGenerating","pdfExportMode");
  state.textContent="Préparation du PDF…";

  const originalScrollY=window.scrollY;
  try{
    if(document.fonts?.ready)await document.fonts.ready;
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));

    const pages=[...document.querySelectorAll("#report .page")];
    if(!pages.length)throw new Error("Aucune page à exporter");

    const safeName=String(currentReportData?.establishment_name||currentDiagnostic?.establishment_name||"etablissement")
      .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
      .replace(/[^a-zA-Z0-9_-]+/g,"_").replace(/^_+|_+$/g,"");
    const stamp=new Date().toISOString().slice(0,10);
    const fileName=`HP_${safeName}_${stamp}.pdf`;

    const pdf=new JsPDF({unit:"mm",format:"a4",orientation:"portrait",compress:true});
    const a4WidthMm=210;
    const a4HeightMm=297;
    let pdfPageCount=0;

    for(let pageIndex=0;pageIndex<pages.length;pageIndex++){
      state.textContent=`Génération PDF · page ${pageIndex+1}/${pages.length}`;

      const pageEl=pages[pageIndex];
      const canvas=await window.html2canvas(pageEl,{
        scale:2.5,
        useCORS:true,
        backgroundColor:"#ffffff",
        logging:false,
        scrollX:0,
        scrollY:0,
        windowWidth:pageEl.scrollWidth,
        windowHeight:pageEl.scrollHeight
      });

      // One HTML section = one PDF page.
      // Never split a chart or a report section across two pages.
      const sourceRatio=canvas.width/canvas.height;
      const a4Ratio=a4WidthMm/a4HeightMm;

      let renderedWidthMm,renderedHeightMm,xMm=0,yMm=0;
      if(sourceRatio>=a4Ratio){
        renderedWidthMm=a4WidthMm;
        renderedHeightMm=a4WidthMm/sourceRatio;
        yMm=(a4HeightMm-renderedHeightMm)/2;
      }else{
        renderedHeightMm=a4HeightMm;
        renderedWidthMm=a4HeightMm*sourceRatio;
        xMm=(a4WidthMm-renderedWidthMm)/2;
      }

      if(pdfPageCount>0)pdf.addPage("a4","portrait");

      // Higher-quality rasterization keeps SVG charts and labels sharp.
      const imgData=canvas.toDataURL("image/jpeg",0.985);
      pdf.addImage(
        imgData,
        "JPEG",
        xMm,yMm,renderedWidthMm,renderedHeightMm,
        undefined,
        "MEDIUM"
      );

      pdfPageCount++;
      canvas.width=1;
      canvas.height=1;
    }

    const blob=pdf.output("blob");
    const path=`${current}/${crypto.randomUUID()}-${fileName}`;

    state.textContent="Archivage du PDF…";
    const {error:upErr}=await sb.storage
      .from("hp-reports")
      .upload(path,blob,{contentType:"application/pdf",upsert:false});
    if(upErr)throw upErr;

    const {error:dbErr}=await sb.from("hp_report_exports").insert({
      diagnostic_id:current,
      proposal_id:currentReportProposal?.id||null,
      file_name:fileName,
      storage_path:path
    });
    if(dbErr)throw dbErr;

    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);

    state.textContent=`PDF enregistré · ${pdfPageCount} section${pdfPageCount>1?"s":""} / ${pdfPageCount} page${pdfPageCount>1?"s":""}.`;
  }catch(e){
    console.error("Erreur génération PDF",e);
    state.textContent="Erreur PDF : "+(e?.message||"échec de génération");
  }finally{
    document.body.classList.remove("pdfGenerating","pdfExportMode");
    window.scrollTo(0,originalScrollY);
    btn.disabled=false;
  }
}

function revenueChart(rows){

 <div class="visualPanel"><h3>Lecture du rapport</h3><p class="small muted" style="margin:0">HP distingue les données collectées, les constats, les recommandations, les niveaux de référence et les évolutions observées. Une amélioration entre deux périodes n’est attribuée à l’accompagnement HP que lorsqu’un lien peut être clairement établi. Chaque étape est conservée pour pouvoir revenir à la situation de départ, aux suivis et au bilan final.</p></div>
 
 <div class="visualPanel"><h3>Quelques termes utilisés</h3>
 <p class="small muted" style="margin:0"><b>Score HP :</b> niveau de structuration global de l’établissement. <b>Situation de départ :</b> mesure prise avant la mise en œuvre des actions. <b>Niveau de référence :</b> valeur issue d’établissements ou de sources comparables. <b>Fiabilité :</b> solidité des informations disponibles pour justifier un constat.</p></div><p class="footerNote">Méthode Hospitality Performance · Rapport généré le ${reportDate} à partir des données disponibles et validées dans Hospitality Performance.</p>`, "", totalPages));

 if(hasProposal){
   const proposalItems=[...(proposal.hp_proposal_items||[])].sort((a,b)=>Number(a.sort_order||0)-Number(b.sort_order||0));
   const proposalTotal=Number(proposal.total_amount||proposalItems.reduce((sum,x)=>sum+Number(x.price||0),0));
   const proposalPageNo=basePages+1;
   pages.push(page(proposalPageNo,`<div class="eyebrow">${String(proposalPageNo).padStart(2,"0")} · Proposition d’accompagnement</div>
   <h2>${esc(proposal.proposal_name||"Accompagnement Hospitality Performance")}</h2>
   <p class="lead">À partir du diagnostic, HP a identifié les accompagnements les plus pertinents pour corriger les points faibles et renforcer les pratiques de l’établissement.</p>

   <div class="proposalSummary">
     <div class="proposalSummaryBox"><small>Statut de la proposition</small><b>${esc(proposal.status||"Brouillon")}</b></div>
     <div class="proposalSummaryBox total"><small>Montant total</small><b>${proposalTotal.toLocaleString("fr-FR",{maximumFractionDigits:0})} €</b></div>
   </div>

   <div class="proposalReportList">
     ${proposalItems.map(x=>`<div class="proposalReportItem">
       <div class="proposalReportTop">
         <div><b>${esc(x.service_name)}</b><div class="proposalReportMeta">${esc(x.service_family||"Accompagnement")} · ${esc(x.duration||"Durée à définir")} · ${esc(x.format||"Format à définir")}</div></div>
         <div class="proposalReportPrice">${Number(x.price||0).toLocaleString("fr-FR",{maximumFractionDigits:0})} €</div>
       </div>
       ${Array.isArray(x.deliverables)&&x.deliverables.length?`<div class="proposalReportDeliverables"><b>Livrables prévus :</b> ${esc(x.deliverables.join(" · "))}</div>`:""}
       ${x.rationale?`<div class="proposalReportReason"><b>Pourquoi cet accompagnement :</b> ${esc(x.rationale)}</div>`:""}
     </div>`).join("")}
   </div>

   ${proposal.notes?`<div class="visualPanel"><h3>Précisions sur la proposition</h3><p class="small muted" style="margin:0">${esc(proposal.notes)}</p></div>`:""}

   <div class="proposalClosing"><p><b>Principe :</b> cette proposition est construite à partir des besoins identifiés dans le diagnostic HP. Son contenu, sa durée et son périmètre peuvent être ajustés avant validation avec l’établissement.</p></div>
   <p class="footerNote">Proposition générée depuis Hospitality Performance · ${reportDate}</p>`, "", totalPages));
 }

 if(hasProposal&&planChunks.length){
   planChunks.forEach((chunk,idx)=>{
     const pageNo=basePages+2+idx;
     pages.push(page(pageNo,`<div class="eyebrow">${String(pageNo).padStart(2,"0")} · Plan d’action</div>
     <h2>${idx===0?"Plan d’action des prestations retenues":"Plan d’action · suite"}</h2>
     <p class="lead">Ce plan traduit les prestations retenues en actions concrètes, avec livrables attendus et critères de réussite.</p>
     <div class="proposalReportList">
       ${chunk.map(([service,steps])=>`<div class="visualPanel">
         <h3>${esc(service)}</h3>
         ${steps.sort((a,b)=>Number(a.step_order||0)-Number(b.step_order||0)).map(x=>`<div class="proposalReportItem">
           <div class="proposalReportTop"><div><b>${esc(x.phase)} · ${esc(x.action_title)}</b><div class="proposalReportMeta">${esc(x.action_description||"")}</div></div></div>
           <div class="proposalReportDeliverables"><b>Livrable :</b> ${esc(x.deliverable||"—")}</div>
           <div class="proposalReportReason"><b>Critère de réussite :</b> ${esc(x.success_indicator||"—")}</div>
         </div>`).join("")}
       </div>`).join("")}
     </div>
     <div class="proposalClosing"><p><b>Suivi :</b> les actions doivent être adaptées au contexte réel de l’établissement et validées au fil de l’accompagnement. Les résultats sont ensuite mesurés dans les évaluations de suivi HP.</p></div>`, "printBreak", totalPages));
   });
 }


 $("report").innerHTML=pages.join("");
}
boot();
</script>
</body>
</html>
