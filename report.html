async function savePdf(){
  const btn=$("printBtn"),state=$("pdfState");
  const JsPDF=window.jspdf?.jsPDF;
  if(typeof window.html2canvas!=="function"||!JsPDF){
    state.textContent="Générateur PDF indisponible.";
    return;
  }

  btn.disabled=true;
  /* PDF capture uses the exact rendered landscape layout; no export reflow class. */
  state.textContent="Préparation du PDF…";

  const originalScrollY=window.scrollY;
  try{
    if(document.fonts?.ready)await document.fonts.ready;
    await hpWaitForReportImages();
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));

    const pages=[...document.querySelectorAll("#report .page")];
    if(!pages.length)throw new Error("Aucune page à exporter");

    const safeName=String(currentReportData?.establishment_name||currentDiagnostic?.establishment_name||"etablissement")
      .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
      .replace(/[^a-zA-Z0-9_-]+/g,"_").replace(/^_+|_+$/g,"");
    const stamp=new Date().toISOString().slice(0,10);
    const fileName=`HP_${safeName}_${stamp}.pdf`;

    const pdf=new JsPDF({unit:"mm",format:"a4",orientation:"landscape",compress:true});
    const a4WidthMm=297;
    const a4HeightMm=210;
    let pdfPageCount=0;

    for(let pageIndex=0;pageIndex<pages.length;pageIndex++){
      state.textContent=`Génération PDF · page ${pageIndex+1}/${pages.length}`;

      const pageEl=pages[pageIndex];
      const rect=pageEl.getBoundingClientRect();
      const captureWidth=Math.round(rect.width);
      const captureHeight=Math.round(rect.height);

      const canvas=await window.html2canvas(pageEl,{
        scale:2.25,
        useCORS:true,
        allowTaint:false,
        backgroundColor:"#fffefb",
        logging:false,
        scrollX:0,
        scrollY:-window.scrollY,
        width:captureWidth,
        height:captureHeight,
        windowWidth:1600,
        windowHeight:1000,
        x:0,
        y:0,
        onclone:(clonedDoc)=>{
          /* Preserve the screen layout exactly; legacy PDF classes must never alter it. */
          clonedDoc.body.classList.remove("pdfExportMode");
          const clonedPages=[...clonedDoc.querySelectorAll("#report .page")];
          const clonedPage=clonedPages[pageIndex] || null;
          if(clonedPage){
            clonedPage.style.width="297mm";
            clonedPage.style.height="210mm";
            clonedPage.style.minHeight="210mm";
            clonedPage.style.maxHeight="210mm";
            clonedPage.style.margin="0";
            clonedPage.style.transform="none";
          }
        }
      });

      // One HTML section = one PDF page.
      // Never split a chart or a report section across two pages.
      const sourceRatio=canvas.width/canvas.height;
      const a4Ratio=a4WidthMm/a4HeightMm;

      let renderedWidthMm,renderedHeightMm,xMm=0,yMm=0;
      if(sourceRatio>=a4Ratio){
        renderedWidthMm=a4WidthMm;
        renderedHeightMm=a4WidthMm/sourceRatio;
        yMm=(a4HeightMm-renderedHeightMm)/2;
      }else{
        renderedHeightMm=a4HeightMm;
        renderedWidthMm=a4HeightMm*sourceRatio;
        xMm=(a4WidthMm-renderedWidthMm)/2;
      }

      if(pdfPageCount>0)pdf.addPage("a4","landscape");

      // Higher-quality rasterization keeps SVG charts and labels sharp.
      const imgData=canvas.toDataURL("image/jpeg",0.985);
      pdf.addImage(
        imgData,
        "JPEG",
        xMm,yMm,renderedWidthMm,renderedHeightMm,
        undefined,
        "MEDIUM"
      );

      pdfPageCount++;
      canvas.width=1;
      canvas.height=1;
    }

    const blob=pdf.output("blob");
    const path=`${current}/${crypto.randomUUID()}-${fileName}`;

    state.textContent="Archivage du PDF…";
    const {error:upErr}=await sb.storage
      .from("hp-reports")
      .upload(path,blob,{contentType:"application/pdf",upsert:false});
    if(upErr)throw upErr;

    const {error:dbErr}=await sb.from("hp_report_exports").insert({
      diagnostic_id:current,
      proposal_id:currentReportProposal?.id||null,
      file_name:fileName,
      storage_path:path
    });
    if(dbErr)throw dbErr;

    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);

    state.textContent=`PDF enregistré · ${pdfPageCount} section${pdfPageCount>1?"s":""} / ${pdfPageCount} page${pdfPageCount>1?"s":""}.`;
  }catch(e){
    console.error("Erreur génération PDF",e);
    state.textContent="Erreur PDF : "+(e?.message||"échec de génération");
  }finally{
    /* No export layout class to remove. */
    window.scrollTo(0,originalScrollY);
    btn.disabled=false;
  }
}

       <div><b>${esc(p.title)}</b><p>${esc(p.recommended_action||"Levier issu de la matrice Impact × Effort HP.")}</p></div>
       <div class="actionTag">${esc(p.service_area||p.quadrant||"Action HP")}</div>
     </div>`).join("")||'<div class="actionLine"><div>Aucune priorité active.</div></div>'}
   </div>
   <div>
     <h3>Matrice effort / impact</h3>
     <div class="matrix">
       <div class="matrixQuadrant q1">Quick wins</div>
       <div class="matrixQuadrant q2">Prioritaires</div>
       <div class="matrixQuadrant q3">À planifier</div>
       <div class="matrixQuadrant q4">Structurantes</div>
       ${matrixActions.map((a,i)=>{
         const left=Math.max(8,Math.min(92,(Number(a.effort_score)-1)/4*84+8));
         const bottom=Math.max(8,Math.min(92,(Number(a.impact_score)-1)/4*84+8));
         return `<div class="matrixPoint" style="left:${left}%;bottom:${bottom}%">${i+1}</div>`;
       }).join("")}
     </div>
     <div class="matrixHint"><b>${matrixActions.length} action${matrixActions.length>1?"s":""} positionnable${matrixActions.length>1?"s":""} sur ${Math.min(4,actionable.length)}</b> selon les niveaux d’impact et d’effort actuellement renseignés.</div>
   </div>
 </div>

 <h3 style="margin-top:7mm">Feuille de route</h3>
 <div class="roadmapMini">
   ${phases.map(([code,label])=>{
     const items=(actions||[]).filter(a=>String(a.phase_days)===code).sort((a,b)=>Number(b.priority_index||0)-Number(a.priority_index||0)).slice(0,3);
     return `<div class="roadmapMiniCol"><div class="roadmapMiniHead"><b>${label}</b><span>${code==="30"?"Lancer":code==="60"?"Déployer":code==="90"?"Stabiliser":"Ancrer"}</span></div><div class="roadmapMiniBody">${items.map(a=>`<div>${esc(a.action_title||a.action||"Action HP")}</div>`).join("")||"<div>Aucune action planifiée.</div>"}</div></div>`;
   }).join("")}
 </div>

 ${hasImpact?`<div class="visualPanel" style="margin-top:5mm"><h3>Évolution mesurée</h3><p class="small muted" style="margin:0">Situation de départ : <b>${num(impact.baseline_hp_score,1)}/100</b> → dernière évaluation : <b>${num(impact.latest_hp_score,1)}/100</b> · évolution : <b>${Number(impact.hp_score_delta_points)>0?"+":""}${num(impact.hp_score_delta_points,1)} pts</b>.</p></div>`:""}
 `,"",totalPages));

 // Optional commercial proposal retained after the five main report pages.
 if(hasProposal){
   const proposalItems=[...(proposal.hp_proposal_items||[])].sort((a,b)=>Number(a.sort_order||0)-Number(b.sort_order||0));
   const proposalTotal=Number(proposal.total_amount||proposalItems.reduce((sum,x)=>sum+Number(x.price||0),0));
   const proposalPageNo=6;
   pages.push(page(proposalPageNo,`<div class="eyebrow">${String(proposalPageNo).padStart(2,"0")} · Proposition d’accompagnement</div>
   <h2>${esc(proposal.proposal_name||"Accompagnement Hospitality Performance")}</h2>
   <p class="lead">Les prestations proposées traduisent directement les besoins identifiés dans le diagnostic HP.</p>
   <div class="proposalSummary">
     <div class="proposalSummaryBox"><small>Statut</small><b>${esc(proposal.status||"Brouillon")}</b></div>
     <div class="proposalSummaryBox total"><small>Montant total</small><b>${proposalTotal.toLocaleString("fr-FR",{maximumFractionDigits:0})} €</b></div>
   </div>
   <div class="proposalReportList">
     ${proposalItems.map(x=>`<div class="proposalReportItem"><div class="proposalReportTop"><div><b>${esc(x.service_name)}</b><div class="proposalReportMeta">${esc(x.service_family||"Accompagnement")} · ${esc(x.duration||"Durée à définir")} · ${esc(x.format||"Format à définir")}</div></div><div class="proposalReportPrice">${Number(x.price||0).toLocaleString("fr-FR",{maximumFractionDigits:0})} €</div></div>${Array.isArray(x.deliverables)&&x.deliverables.length?`<div class="proposalReportDeliverables"><b>Livrables :</b> ${esc(x.deliverables.join(" · "))}</div>`:""}${x.rationale?`<div class="proposalReportReason"><b>Pourquoi :</b> ${esc(x.rationale)}</div>`:""}</div>`).join("")}
   </div>`, "", totalPages));
 }

 if(hasProposalPlan){
   planChunks.forEach((chunk,idx)=>{
     const pageNo=6+proposalPageCount+idx;
     pages.push(page(pageNo,`<div class="eyebrow">${String(pageNo).padStart(2,"0")} · Plan d’action des prestations</div>
     <h2>${idx===0?"Plan d’action des prestations retenues":"Plan d’action · suite"}</h2>
     <div class="proposalReportList">
       ${chunk.map(([service,steps])=>`<div class="visualPanel"><h3>${esc(service)}</h3>${steps.sort((a,b)=>Number(a.step_order||0)-Number(b.step_order||0)).map(x=>`<div class="proposalReportItem"><div class="proposalReportTop"><div><b>${esc(x.phase)} · ${esc(x.action_title)}</b><div class="proposalReportMeta">${esc(x.action_description||"")}</div></div></div><div class="proposalReportDeliverables"><b>Livrable :</b> ${esc(x.deliverable||"—")}</div><div class="proposalReportReason"><b>Critère de réussite :</b> ${esc(x.success_indicator||"—")}</div></div>`).join("")}</div>`).join("")}
     </div>`, "", totalPages));
   });
 }

 $("report").innerHTML=pages.join("");
}
boot();
</script>
</body>
</html>
