<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HP | Suivi des missions</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#193b32;background:#f6f6f2;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{background:#103d32;color:#fff;padding:18px max(20px,calc((100vw - 1160px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}.top b{font:700 24px Georgia,serif}.top small{display:block;opacity:.8;font-size:12px;margin-top:5px}.top button{background:#fff;color:#103d32;border:0;border-radius:9px;padding:10px 14px;font-weight:700}.wrap{max-width:1160px;margin:28px auto 60px;padding:0 20px}.lead{display:flex;justify-content:space-between;gap:20px;align-items:start}.lead h1{font:700 33px Georgia,serif;margin:0 0 8px}.lead p{margin:0;color:#68776e;line-height:1.55}.tag{display:inline-flex;align-items:center;border-radius:99px;padding:6px 10px;background:#e8eee9;color:#28584a;font-size:11px;font-weight:800}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:23px 0}.summary article,.panel,.mission{border:1px solid #e1e6e0;background:#fff;border-radius:14px}.summary article{padding:17px}.summary strong{display:block;font:700 29px Georgia,serif;margin:7px 0}.summary small{color:#68776e}.panel{padding:20px;margin:22px 0}.panel h2,.mission h2{font:700 23px Georgia,serif;margin:0 0 8px}.panel p{color:#65756b;line-height:1.5;margin:0 0 14px}.mission{margin:20px 0;overflow:hidden}.missionHead{display:flex;justify-content:space-between;align-items:start;gap:16px;padding:20px 22px;border-bottom:1px solid #e8ebe6}.missionHead p{color:#6a766e;margin:4px 0 0}.bar{height:7px;border-radius:20px;background:#e9eeea;overflow:hidden;margin-top:9px;width:160px}.bar span{height:100%;display:block;background:#2b7d58}.step{padding:19px 22px;border-bottom:1px solid #e9ece8}.step:last-child{border:0}.step h3{margin:0;font-size:15px}.stepIntro{display:flex;justify-content:space-between;align-items:center;gap:12px}.step p{color:#69766e;margin:7px 0 12px;line-height:1.45}.fields{display:grid;grid-template-columns:150px minmax(120px,1fr) 150px;gap:12px;margin-top:12px}.field label{display:block;color:#59695f;font-size:11px;font-weight:750;margin-bottom:6px}.field input,.field select,.field textarea{border:1px solid #d9e0d8;border-radius:8px;background:#fff;padding:10px;width:100%;min-width:0;color:#233e33}.field textarea{min-height:65px;resize:vertical}.longfields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.stepFoot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}.stepFoot button{background:#153f32;color:white;border:0;border-radius:8px;padding:10px 16px;font-weight:800}.stepFoot button:disabled{opacity:.55}.note{font-size:11px;color:#64746b}.status{border-radius:99px;padding:5px 9px;font-size:10px;font-weight:850;background:#edf1ec;color:#5e695e}.status[data-status="En cours"]{background:#edf2fc;color:#315b94}.status[data-status="Bloqué"]{background:#fce9e7;color:#a64037}.status[data-status="Terminé"]{background:#e0f1e7;color:#176844}.kpi{width:100%;border-collapse:collapse}.kpi th{text-align:left;color:#5f6f64;font-size:11px;background:#f5f7f4}.kpi td,.kpi th{padding:12px 10px;border-bottom:1px solid #e5ebe4;vertical-align:top}.kpi td:nth-child(2),.kpi td:nth-child(3){white-space:nowrap}.muted{color:#6a766c;font-size:12px}.warning{padding:13px 15px;border-left:3px solid #b28830;background:#fbf7eb;color:#715a28;line-height:1.5}.error{color:#af423c}.empty{padding:25px 8px;color:#6d786e}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}.actions a{color:#206953;font-weight:700;text-decoration:none}@media(max-width:700px){.lead,.missionHead{display:block}.summary{grid-template-columns:1fr 1fr}.fields,.longfields{grid-template-columns:1fr}.kpi{display:block;overflow:auto}.stepIntro{align-items:start}.bar{width:100%;margin-bottom:10px}}@media print{.top button,.stepFoot button{display:none}.wrap{max-width:100%;margin:12px auto}.mission{break-before:page}.step{break-inside:avoid}}
</style></head><body>
<header class="top"><div><b>HP</b><small>Hospitality Performance · Suivi consultant</small></div><button id="back">Retour au rapport consultant</button></header>
<main class="wrap" id="app"><div class="empty">Chargement des missions…</div></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.116.0';
const sb=createClient('https://wztiaiwjprarpdzsudpx.supabase.co','sb_publishable_JqSGi4QEil2MBaI5tYsQvA_wQnxz8U_');
const q=new URLSearchParams(location.search), proposalId=q.get('proposal'),app=document.getElementById('app');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const str=x=>String(x??'');const num=x=>x===null||x===undefined||x===''?'—':Number(x).toLocaleString('fr-FR',{maximumFractionDigits:2});
let plan=[],mission=[],saved=[],diagnosticId='',corrective=[];
document.getElementById('back').onclick=()=>{location.href='consultant.html?proposal='+encodeURIComponent(proposalId||'')};
function key(r){return r.proposal_item_id+':'+r.step_order}
function state(r){return saved.find(x=>x.proposal_item_id===r.proposal_item_id&&x.step_order===r.step_order)||{status:'À faire',owner_name:'',due_date:'',note:'',evidence_reference:''}}
function summary(){const total=plan.length,done=plan.filter(x=>state(x).status==='Terminé').length,active=plan.filter(x=>state(x).status==='En cours').length,blocked=plan.filter(x=>state(x).status==='Bloqué').length;return {total,done,active,blocked}}
function render(){const h=mission[0]||plan[0]||{};const counts=summary();let byItem=new Map();for(const row of plan){if(!byItem.has(row.proposal_item_id))byItem.set(row.proposal_item_id,[]);byItem.get(row.proposal_item_id).push(row)}
app.innerHTML=`<div class="lead"><div><h1>Suivi des missions · ${esc(h.establishment_name||'Établissement')}</h1><p>${esc(h.proposal_name||'Proposition enregistrée')} · Statut commercial : ${esc(h.proposal_status||'—')}</p><div class="actions"><a href="consultant.html?proposal=${encodeURIComponent(proposalId)}">Ouvrir le rapport méthodologique</a></div></div><span class="tag">Suivi interne · Aucune modification du HP Score</span></div>
<section class="summary"><article><small>Actions prévues</small><strong>${counts.total}</strong></article><article><small>Terminées</small><strong>${counts.done}</strong></article><article><small>En cours</small><strong>${counts.active}</strong></article><article><small>Bloquées</small><strong>${counts.blocked}</strong></article></section>
<div class="warning">Cette page suit les actions de la proposition enregistrée, même lorsqu'elle est au statut Brouillon. Les statuts sont saisis par le consultant ; ils ne constituent pas une preuve automatique d'impact et ne modifient ni les scores ni la proposition commerciale.</div>
${corrective.length?`<section class="panel"><h2>Suggestions correctives automatiques</h2><p>HP propose des pistes à partir des actions bloquées ou en retard. Elles ne sont jamais appliquées automatiquement.</p>${corrective.map(x=>`<div class="warning" style="margin:9px 0"><b>${esc(x.service_name)} · ${esc(x.suggestion_type)}</b><br>${esc(x.suggested_action)}${x.action_title?`<div class="muted">Action concernée : ${esc(x.action_title)}</div>`:""}</div>`).join("")}</section>`:""}
${[...byItem.entries()].map(([item,rows],idx)=>{const done=rows.filter(x=>state(x).status==='Terminé').length;return `<section class="mission"><div class="missionHead"><div><span class="tag">Mission ${idx+1} · ${esc(rows[0].service_family)}</span><h2>${esc(rows[0].service_name)}</h2><p>${esc(rows[0].proposal_name)}</p></div><div><b>${done}/${rows.length} actions terminées</b><div class="bar"><span style="width:${rows.length?100*done/rows.length:0}%"></span></div></div></div>${rows.map(r=>{const st=state(r),k=key(r);return `<div class="step" data-key="${esc(k)}" data-item="${esc(r.proposal_item_id)}" data-order="${r.step_order}"><div class="stepIntro"><h3>${r.step_order}. ${esc(r.action_title)}</h3><span class="status" data-status="${esc(st.status)}">${esc(st.status)}</span></div><p>${esc(r.action_description||'')}</p><div class="muted"><b>Livrable :</b> ${esc(r.deliverable||'—')} · <b>Réussite attendue :</b> ${esc(r.success_indicator||'—')}</div><div class="fields"><div class="field"><label>Avancement</label><select data-field="status">${['À faire','En cours','Bloqué','Terminé'].map(s=>`<option value="${s}" ${st.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Responsable</label><input maxlength="180" data-field="owner_name" value="${esc(st.owner_name)}" placeholder="Nom / fonction"></div><div class="field"><label>Échéance</label><input type="date" data-field="due_date" value="${esc(st.due_date||'')}"></div></div><div class="longfields"><div class="field"><label>Note d'avancement</label><textarea maxlength="3000" data-field="note" placeholder="Observation factuelle, blocage, prochaine action…">${esc(st.note)}</textarea></div><div class="field"><label>Référence de preuve ou livrable</label><textarea maxlength="800" data-field="evidence_reference" placeholder="Document, référence, emplacement, lien interne…">${esc(st.evidence_reference)}</textarea></div></div><div class="stepFoot"><span class="note" data-feedback>${st.updated_at?'Mis à jour le '+new Date(st.updated_at).toLocaleString('fr-FR'):'Non renseigné'}</span><button type="button" data-save>Enregistrer cette action</button></div></div>`}).join('')}</section>`}).join('')||'<div class="panel">Aucune étape prédéfinie pour cette proposition.</div>'}<section class="panel"><h2>Indicateurs avant / après</h2><p>Lecture des mesures déjà présentes dans HP. Les valeurs ne sont pas modifiables depuis ce suivi : les périodes et sources doivent être documentées et validées dans le module d’indicateurs existant.</p><div id="kpis">Chargement des indicateurs…</div></section>`;
app.querySelectorAll('[data-save]').forEach(b=>b.addEventListener('click',()=>saveStep(b.closest('.step'))));loadMetrics();}
async function saveStep(node){const b=node.querySelector('[data-save]'),f=x=>node.querySelector(`[data-field="${x}"]`).value;let payload={proposal_item_id:node.dataset.item,step_order:Number(node.dataset.order),status:f('status'),owner_name:f('owner_name').trim(),due_date:f('due_date')||null,note:f('note').trim(),evidence_reference:f('evidence_reference').trim(),updated_at:new Date().toISOString()};const old=saved.find(x=>x.proposal_item_id===payload.proposal_item_id&&x.step_order===payload.step_order);payload.completed_at=payload.status==='Terminé'?(old?.completed_at||new Date().toISOString()):null;b.disabled=true;const msg=node.querySelector('[data-feedback]');msg.textContent='Enregistrement…';try{const {data,error}=await sb.from('hp_mission_step_tracking').upsert(payload,{onConflict:'proposal_item_id,step_order'}).select('*').single();if(error)throw error;saved=saved.filter(x=>!(x.proposal_item_id===data.proposal_item_id&&x.step_order===data.step_order));saved.push(data);msg.textContent='Enregistré · '+new Date(data.updated_at).toLocaleString('fr-FR');node.querySelector('.status').dataset.status=data.status;node.querySelector('.status').textContent=data.status;const c=summary();const el=app.querySelector('.summary');el.children[1].querySelector('strong').textContent=c.done;el.children[2].querySelector('strong').textContent=c.active;el.children[3].querySelector('strong').textContent=c.blocked;for(const [item,rows] of new Map(plan.map(x=>[x.proposal_item_id,plan.filter(z=>z.proposal_item_id===x.proposal_item_id)]))){const m=app.querySelector(`.step[data-item="${item}"]`)?.closest('.mission');if(m){let d=rows.filter(x=>state(x).status==='Terminé').length;m.querySelector('.missionHead b').textContent=`${d}/${rows.length} actions terminées`;m.querySelector('.bar span').style.width=(100*d/rows.length)+'%';}}}catch(e){msg.textContent='Échec : '+e.message;msg.classList.add('error')}finally{b.disabled=false}}
async function loadMetrics(){const area=document.getElementById('kpis');if(!area)return;try{const {data,error}=await sb.from('hp_economic_impact_v1').select('metric_label,unit,baseline_value,latest_value,baseline_period_start,baseline_period_end,latest_period_start,latest_period_end,baseline_source_label,latest_source_label,comparable,comparison_status,absolute_delta').eq('diagnostic_id',diagnosticId);if(error)throw error;if(!data?.length){area.innerHTML='<p class="empty">Aucune mesure économique disponible pour ce diagnostic.</p>';return;}area.innerHTML=`<table class="kpi"><thead><tr><th>Indicateur</th><th>Référence</th><th>Dernière mesure</th><th>Comparabilité</th></tr></thead><tbody>${data.map(r=>{const same=(r.baseline_value!==null&&r.latest_value!==null&&Number(r.baseline_value)===Number(r.latest_value));return `<tr><td><b>${esc(r.metric_label)}</b><div class="muted">${esc(r.unit||'')}</div></td><td>${num(r.baseline_value)}<div class="muted">${esc([r.baseline_period_start,r.baseline_period_end].filter(Boolean).join(' → '))}</div></td><td>${num(r.latest_value)}<div class="muted">${esc([r.latest_period_start,r.latest_period_end].filter(Boolean).join(' → '))}</div>${same?'<div class="muted">Aucune variation mesurée</div>':''}</td><td>${r.comparable?'Périodes déclarées comparables':'À vérifier'}<div class="muted">${esc(r.comparison_status||'')}</div></td></tr>`}).join('')}</tbody></table><p class="muted" style="margin-top:12px">Une comparaison valide n'attribue pas à elle seule une évolution à la mission. Vérifier les périodes, méthodes, autres facteurs et sources avant toute conclusion d'impact.</p>`;}catch(e){area.innerHTML=`<p class="error">Indicateurs indisponibles : ${esc(e.message)}</p>`}}
async function load(){if(!proposalId){app.innerHTML='<div class="empty">Ouvre le suivi depuis un rapport lié à une proposition enregistrée.</div>';return;}const {data:{session}}=await sb.auth.getSession();if(!session){app.innerHTML='<div class="empty">Connexion requise. Ouvre ce module depuis l’Administration HP après connexion.</div>';return;}let [m,p,t]=await Promise.all([sb.from('hp_consultant_mission_v1').select('proposal_id,diagnostic_id,establishment_name,proposal_name,proposal_status,proposal_item_id,service_code,service_name,service_family').eq('proposal_id',proposalId),sb.from('hp_proposal_action_plan_v1').select('*').eq('proposal_id',proposalId).order('step_order'),sb.from('hp_proposal_items').select('id').eq('proposal_id',proposalId)]);if(m.error)throw m.error;if(p.error)throw p.error;if(t.error)throw t.error;mission=m.data||[];plan=p.data||[];if(!mission.length){app.innerHTML='<div class="empty">Aucune prestation trouvée dans cette proposition ou accès non autorisé.</div>';return;}diagnosticId=mission[0].diagnostic_id;let itemIds=(t.data||[]).map(x=>x.id);if(itemIds.length){const x=await sb.from('hp_mission_step_tracking').select('*').in('proposal_item_id',itemIds);if(x.error)throw x.error;saved=x.data||[];}const cr=await sb.from('hp_corrective_action_suggestions_v1').select('*').eq('proposal_id',proposalId);corrective=cr.error?[]:(cr.data||[]);render();}
load().catch(e=>{console.error(e);app.innerHTML=`<div class="panel error">Erreur de chargement : ${esc(e.message)}</div>`});
</script></body></html>
