<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HP | Bilan d’intervention</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#193b32;background:#f6f6f2;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{background:#103d32;color:#fff;padding:18px max(20px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px}.top b{font:700 24px Georgia,serif}.top small{display:block;font-size:12px;opacity:.75;margin-top:4px}.top a{background:white;color:#103d32;padding:10px 13px;border-radius:8px;text-decoration:none;font-weight:750}.wrap{max-width:1120px;margin:29px auto 65px;padding:0 20px}h1,h2{font-family:Georgia,serif}h1{font-size:34px;margin:0 0 8px}h2{font-size:23px;margin:0 0 12px}.muted{color:#69766e;font-size:12px;line-height:1.5}.lead{display:flex;align-items:start;justify-content:space-between;gap:15px;margin-bottom:23px}.lead p{color:#68776e;line-height:1.6}.tag{display:inline-block;padding:6px 10px;border-radius:99px;background:#e8eee9;color:#28584a;font-size:11px;font-weight:800}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.card,.panel{border:1px solid #e1e6e0;background:#fff;border-radius:13px}.card{padding:16px}.card strong{display:block;font:700 30px Georgia,serif;margin:9px 0 3px}.panel{padding:22px;margin:19px 0}.notice{border-left:3px solid #b28a39;background:#fcf8ed;padding:12px 15px;color:#725a27;line-height:1.5;margin:17px 0}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.mission{border:1px solid #e4e8e2;border-radius:10px;padding:16px;margin:12px 0;background:#fbfcfb}.mission h3{font-size:16px;margin:0 0 9px}.track{height:8px;border-radius:8px;overflow:hidden;background:#e9eeea;margin-top:10px}.track>span{display:block;height:100%;background:#2b805a}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th{text-align:left;background:#f4f7f3;color:#506459;font-size:11px}td,th{padding:11px 9px;border-bottom:1px solid #e8ede7;vertical-align:top}td{font-size:12px;line-height:1.4}.unit{font-size:11px;color:#79877f}.flag{display:inline-block;font-size:10px;font-weight:800;padding:5px 7px;border-radius:6px;background:#edf1ec;color:#51665b}.flag.good{background:#e7f3e9;color:#276444}.flag.warn{background:#fcf0d6;color:#7d5911}.flag.neutral{background:#edf0f2;color:#57646c}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin:12px 0}.field label{font-weight:750;display:block;margin-bottom:7px;font-size:12px}.field input,.field select,.field textarea{width:100%;border:1px solid #d9e1d9;border-radius:8px;background:#fff;color:#1b3b30;padding:10px}.field textarea{resize:vertical;min-height:110px;line-height:1.5}.field.wide{grid-column:1/-1}.footer{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;border-top:1px solid #e3e9e2;padding-top:17px;margin-top:17px}.btn{border:0;border-radius:8px;background:#103d32;color:white;padding:11px 17px;font-weight:750}.btn.secondary{background:#edf2ed;color:#204b3b}.btn:disabled{opacity:.55}.error{color:#a93f39}.empty{padding:25px;color:#69766e}.download-note{font-size:11px;color:#6e7d70}#chooser{max-width:700px}.noprint{}@media(max-width:740px){.cards{grid-template-columns:1fr 1fr}.grid2,.fields{grid-template-columns:1fr}.field.wide{grid-column:1}.lead{display:block}h1{font-size:28px}.top{padding:15px}.panel{padding:15px}}@media print{body{background:#fff;color:#111}.top,.noprint,#chooser{display:none!important}.wrap{max-width:100%;margin:0;padding:0}.panel{break-inside:avoid;border-color:#d6ddd5}.mission{break-inside:avoid}.field textarea,.field input{border:0;padding:0;min-height:0}.card{break-inside:avoid}h1{font-size:27px}@page{size:A4 portrait;margin:14mm}}
</style></head><body>
<header class="top"><div><b>HP</b><small>Hospitality Performance · Bilan d’intervention</small></div><a id="back" href="suivi.html">Retour au suivi des missions</a></header>
<main class="wrap"><div id="app" class="empty">Chargement du bilan…</div></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.116.0';
const sb=createClient('https://wztiaiwjprarpdzsudpx.supabase.co','sb_publishable_JqSGi4QEil2MBaI5tYsQvA_wQnxz8U_');
const q=new URLSearchParams(location.search),app=document.getElementById('app');let proposalId=q.get('proposal')||'';
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const number=v=>v===null||v===undefined||v===''?'—':Number(v).toLocaleString('fr-FR',{maximumFractionDigits:2});
const dated=v=>v?new Date(v).toLocaleDateString('fr-FR'):'—';
const unit=v=>v==='EUR_HT'?'€ HT':v==='EUR'?'€':v||'';
let head,steps=[],tracked=[],metrics=[],score=null,review=null;
function action(r){return tracked.find(x=>x.proposal_item_id===r.proposal_item_id&&x.step_order===r.step_order)||{status:'À faire'}}
function sameSnapshot(m){return Boolean(m.baseline_snapshot_id&&m.latest_snapshot_id&&m.baseline_snapshot_id===m.latest_snapshot_id)}
function metricState(m){if(m.baseline_value===null||m.latest_value===null)return {label:'Mesure manquante',cl:'warn',usable:false};if(sameSnapshot(m))return {label:'Même relevé initial/final',cl:'neutral',usable:false};if(!m.comparable)return {label:'Comparaison à contrôler',cl:'warn',usable:false};return {label:'Comparaison disponible',cl:'good',usable:true}}
function render(){const total=steps.length,done=steps.filter(x=>action(x).status==='Terminé').length,ongoing=steps.filter(x=>action(x).status==='En cours').length,blocked=steps.filter(x=>action(x).status==='Bloqué').length;
const grouped=new Map();for(const s of steps){if(!grouped.has(s.proposal_item_id))grouped.set(s.proposal_item_id,[]);grouped.get(s.proposal_item_id).push(s)}const reviewed=review||{};
app.className='';app.innerHTML=`<div class="lead"><div><span class="tag">Bilan interne · ${esc(review?.assessment_status||'Brouillon')}</span><h1>${esc(head?.establishment_name||'Établissement')}</h1><p>${esc(head?.proposal_name||'Proposition enregistrée')}<br>État des actions et des indicateurs disponibles. Les résultats ne sont jamais attribués automatiquement à HP.</p></div><span class="tag">Proposition : ${esc(head?.status||'—')}</span></div>
<section class="cards"><article class="card"><small>Actions prévues</small><strong>${total}</strong></article><article class="card"><small>Terminées</small><strong>${done}</strong></article><article class="card"><small>En cours</small><strong>${ongoing}</strong></article><article class="card"><small>Bloquées</small><strong>${blocked}</strong></article></section>
<div class="notice">${total?`${done} action(s) sur ${total} déclarée(s) terminée(s) (${Math.round(done/total*100)} %).`:'Aucune action rattachée à cette proposition.'} Il s'agit d'un avancement déclaré, distinct des preuves et de l’impact mesuré. Les propositions au statut « Brouillon » ne sont pas considérées comme interventions réalisées.</div>
<section class="panel"><h2>1. Avancement par mission</h2>${[...grouped.values()].map((rows,i)=>{const d=rows.filter(x=>action(x).status==='Terminé').length;return `<article class="mission"><h3>Mission ${i+1} · ${esc(rows[0].service_name)}</h3><div class="muted">${d}/${rows.length} actions terminées · ${rows.filter(x=>action(x).status==='En cours').length} en cours · ${rows.filter(x=>action(x).status==='Bloqué').length} bloquée(s)</div><div class="track"><span style="width:${100*d/rows.length}%"></span></div><div class="tablewrap"><table><thead><tr><th>Étape</th><th>Statut</th><th>Responsable</th><th>Échéance</th><th>Référence de preuve</th></tr></thead><tbody>${rows.map(s=>{const a=action(s);return `<tr><td>${esc(s.action_title)}</td><td>${esc(a.status)}</td><td>${esc(a.owner_name||'—')}</td><td>${esc(a.due_date||'—')}</td><td>${esc(a.evidence_reference||'Non renseignée')}</td></tr>`}).join('')}</tbody></table></div></article>`}).join('')||'<p class="muted">Aucun plan d’action disponible.</p>'}</section>
<section class="panel"><h2>2. Indicateurs avant / après</h2><p class="muted">Valeurs du diagnostic, indépendantes de la proposition. Une variation n'est montrée comme exploitable que si les relevés sont distincts et la vue HP signale une comparaison possible. La comparabilité reste à vérifier par le consultant.</p><div class="tablewrap"><table><thead><tr><th>Indicateur</th><th>Référence</th><th>Dernière mesure</th><th>Évolution</th><th>Lecture</th></tr></thead><tbody>${metrics.map(m=>{const s=metricState(m),delta=s.usable&&m.absolute_delta!==null?number(m.absolute_delta)+' '+esc(unit(m.unit)):'—';return `<tr><td><b>${esc(m.metric_label)}</b><div class="unit">${esc(m.service_area||'')}</div></td><td>${number(m.baseline_value)} ${esc(unit(m.unit))}<div class="unit">${esc([m.baseline_period_start,m.baseline_period_end].filter(Boolean).join(' → ')||dated(m.baseline_date))}</div><div class="unit">${esc(m.baseline_source_label||'Source non précisée')}</div></td><td>${number(m.latest_value)} ${esc(unit(m.unit))}<div class="unit">${esc([m.latest_period_start,m.latest_period_end].filter(Boolean).join(' → ')||dated(m.latest_date))}</div><div class="unit">${esc(m.latest_source_label||'Source non précisée')}</div></td><td>${delta}</td><td><span class="flag ${s.cl}">${s.label}</span><div class="unit">${esc(m.comparison_status||'')}</div></td></tr>`}).join('')||'<tr><td colspan="5">Aucune donnée économique disponible.</td></tr>'}</tbody></table></div></section>
<section class="panel"><h2>3. Score HP dans le temps</h2>${score?`<div class="grid2"><div class="mission"><div class="muted">Référence · ${dated(score.baseline_date)}</div><h2>${number(score.baseline_hp_score)}/100</h2><div class="muted">Couverture : ${number(score.baseline_coverage_pct)} %</div></div><div class="mission"><div class="muted">Dernier relevé · ${dated(score.latest_date)}</div><h2>${number(score.latest_hp_score)}/100</h2><div class="muted">Couverture : ${number(score.latest_coverage_pct)} %</div></div></div><div class="notice">${esc(score.comparison_status||'Comparaison non établie')}. Cette section affiche les scores existants ; elle ne recalculera pas le HP Score et ne prouvera pas à elle seule l’effet d'une intervention.</div>`:'<p class="muted">Aucune comparaison du score HP disponible.</p>'}</section>
<section class="panel" id="review"><h2>4. Conclusion du consultant</h2><p class="muted">Évaluation humaine enregistrée pour cette proposition seulement. Le statut « Validé » signifie que le consultant a validé le bilan, pas que l’impact économique est démontré.</p><div class="fields"><div class="field"><label for="reviewDate">Date du bilan</label><input id="reviewDate" type="date" value="${esc(reviewed.review_date||'')}"></div><div class="field"><label for="reviewStatus">État du document</label><select id="reviewStatus">${['Brouillon','À compléter','Validé'].map(s=>`<option ${reviewed.assessment_status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="achievements">Résultats et réalisations constatés</label><textarea id="achievements" maxlength="5000" placeholder="Réalisations vérifiées, références de preuves…">${esc(reviewed.achievements||'')}</textarea></div><div class="field"><label for="difficulties">Difficultés et écarts aux objectifs</label><textarea id="difficulties" maxlength="5000" placeholder="Ce qui reste à résoudre…">${esc(reviewed.difficulties||'')}</textarea></div><div class="field"><label for="external">Facteurs externes / limites de comparaison</label><textarea id="external" maxlength="3000" placeholder="Saisonnalité, volumes, changement de méthode, données manquantes…">${esc(reviewed.external_factors||'')}</textarea></div><div class="field"><label for="nextSteps">Prochaines actions</label><textarea id="nextSteps" maxlength="5000" placeholder="Action, responsable, échéance indicative…">${esc(reviewed.next_steps||'')}</textarea></div><div class="field wide"><label for="conclusion">Synthèse et appréciation du consultant</label><textarea id="conclusion" maxlength="5000" placeholder="Distinguer résultats démontrés, progrès observés et éléments non vérifiés.">${esc(reviewed.consultant_conclusion||'')}</textarea></div></div><div class="footer"><span class="muted" id="saveInfo">${reviewed.updated_at?'Dernier enregistrement : '+dated(reviewed.updated_at):'Aucun bilan encore enregistré'}</span><div class="actions noprint"><button class="btn secondary" id="print">Imprimer / enregistrer en PDF</button><button class="btn" id="save">Enregistrer le bilan</button></div></div></section>`;
document.getElementById('save').onclick=saveReview;document.getElementById('print').onclick=()=>window.print();}
async function saveReview(){const button=document.getElementById('save'),info=document.getElementById('saveInfo');const get=id=>document.getElementById(id).value.trim();const payload={proposal_id:proposalId,review_date:get('reviewDate')||null,assessment_status:get('reviewStatus'),achievements:get('achievements'),difficulties:get('difficulties'),external_factors:get('external'),next_steps:get('nextSteps'),consultant_conclusion:get('conclusion'),updated_at:new Date().toISOString()};if(payload.assessment_status==='Validé'&&(!payload.review_date||!payload.consultant_conclusion)){info.textContent='Pour valider : renseigner une date et une conclusion.';info.className='error';return;}button.disabled=true;info.textContent='Enregistrement…';try{const {data,error}=await sb.from('hp_intervention_reviews').upsert(payload,{onConflict:'proposal_id'}).select('*').single();if(error)throw error;review=data;info.className='muted';info.textContent='Enregistré · '+new Date(data.updated_at).toLocaleString('fr-FR');}catch(e){info.className='error';info.textContent='Échec : '+e.message}finally{button.disabled=false}}
async function chooseProposal(){const {data,error}=await sb.from('hp_proposals').select('id,proposal_name,status,created_at,diagnostic_id').order('created_at',{ascending:false}).limit(100);if(error)throw error;app.className='panel';app.innerHTML=`<div id="chooser"><h1>Choisir une proposition</h1><p class="muted">Ouvre un bilan à partir d’une proposition enregistrée. Les bilans sont isolés par proposition.</p><div class="field"><label for="proposalSelect">Proposition</label><select id="proposalSelect"><option value="">Sélectionner…</option>${(data||[]).map(x=>`<option value="${esc(x.id)}">${esc(x.proposal_name)} · ${esc(x.status)} · ${dated(x.created_at)}</option>`).join('')}</select></div><button class="btn" id="openProposal">Ouvrir le bilan</button></div>`;document.getElementById('openProposal').onclick=()=>{const value=document.getElementById('proposalSelect').value;if(value)location.href='bilan.html?proposal='+encodeURIComponent(value)}}
async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){app.innerHTML='<div class="panel error">Connexion requise. Connecte-toi à l’Administration HP puis rouvre le bilan.</div>';return;}if(!proposalId){await chooseProposal();return;}document.getElementById('back').href='suivi.html?proposal='+encodeURIComponent(proposalId);
const [p,m,t,im,s]=await Promise.all([sb.from('hp_proposals').select('id,proposal_name,status,diagnostic_id').eq('id',proposalId).single(),sb.from('hp_proposal_action_plan_v1').select('*').eq('proposal_id',proposalId).order('step_order'),sb.from('hp_proposal_items').select('id').eq('proposal_id',proposalId),sb.from('hp_intervention_reviews').select('*').eq('proposal_id',proposalId).maybeSingle(),sb.from('hp_consultant_mission_v1').select('establishment_name').eq('proposal_id',proposalId).limit(1)]);for(const x of [p,m,t,im,s])if(x.error)throw x.error;if(!p.data)throw new Error('Proposition introuvable');head={...p.data,establishment_name:s.data?.[0]?.establishment_name||'Établissement'};steps=m.data||[];review=im.data||null;const ids=(t.data||[]).map(x=>x.id);const [track,met,sco]=await Promise.all([ids.length?sb.from('hp_mission_step_tracking').select('*').in('proposal_item_id',ids):Promise.resolve({data:[],error:null}),sb.from('hp_economic_impact_v1').select('*').eq('diagnostic_id',head.diagnostic_id),sb.from('hp_score_impact_v1').select('*').eq('diagnostic_id',head.diagnostic_id).maybeSingle()]);for(const x of [track,met,sco])if(x.error)throw x.error;tracked=track.data||[];metrics=met.data||[];score=sco.data||null;render()}
load().catch(e=>{console.error(e);app.innerHTML='<div class="panel error">Chargement impossible : '+esc(e.message)+'</div>'});
</script></body></html>
