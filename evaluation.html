<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>HP | Évaluation & clôture</title>
<style>
:root{font-family:Inter,Arial,sans-serif;background:#f6f6f2;color:#193b32;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}a{color:inherit}.top{background:#103d32;color:#fff;padding:18px max(20px,calc((100vw - 1160px)/2));display:flex;justify-content:space-between;align-items:center;gap:14px}.top b{font:700 25px Georgia,serif}.top small{display:block;font-size:12px;opacity:.75;margin-top:4px}.top a{background:#fff;color:#103d32;text-decoration:none;padding:10px 13px;border-radius:8px;font-weight:750}.wrap{max-width:1160px;margin:28px auto 64px;padding:0 20px}h1,h2,h3{font-family:Georgia,serif}h1{font-size:34px;margin:4px 0 8px}h2{font-size:23px;margin:0 0 11px}h3{font-size:18px;margin:0 0 8px}.lead{display:flex;justify-content:space-between;gap:20px;align-items:start}.lead p{color:#68776e;line-height:1.55}.tag{display:inline-flex;border-radius:99px;background:#e8eee9;color:#28584a;font-size:11px;font-weight:800;padding:6px 10px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.tab{border:1px solid #dce4dc;background:#fff;color:#315748;padding:9px 13px;border-radius:8px;font-weight:750;cursor:pointer}.tab.active{background:#103d32;color:#fff;border-color:#103d32}.panel,.card,.checkpoint{background:#fff;border:1px solid #e1e6e0;border-radius:13px}.panel{padding:22px;margin:18px 0}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.card{padding:15px}.card strong{display:block;font:700 27px Georgia,serif;margin-top:6px}.muted{font-size:12px;color:#69766e;line-height:1.5}.automationBox{background:#f7f9f7;border:1px solid #dce5dd;border-radius:11px;padding:14px 16px;margin:14px 0}.automationEvent{display:grid;grid-template-columns:110px 1fr auto;gap:12px;padding:8px 0;border-top:1px solid #e2e8e2;align-items:start}.automationEvent:first-child{border-top:0}.autoOk{color:#276b4d}.autoWarn{color:#9a6416}@media(max-width:650px){.automationEvent{grid-template-columns:1fr}}.notice{border-left:3px solid #b28a39;background:#fcf8ed;color:#725a27;padding:12px 15px;line-height:1.5;margin:15px 0}.notice.ok{border-left-color:#39765a;background:#eff7f1;color:#315e48}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin:9px 0}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #d9e1d9;border-radius:8px;padding:10px;color:#193b32;background:#fff}.field textarea{min-height:105px;resize:vertical;line-height:1.5}.wide{grid-column:1/-1}.btn{border:0;border-radius:8px;background:#103d32;color:#fff;padding:11px 17px;font-weight:750;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}.btn.secondary{background:#edf2ed;color:#204b3b}.btn:disabled{opacity:.55}.footer{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap;border-top:1px solid #e4e9e3;margin-top:16px;padding-top:15px}.checkpoint{padding:18px;margin:14px 0}.checkhead{display:flex;justify-content:space-between;gap:15px;align-items:start}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 9px;border-bottom:1px solid #e8ede7;vertical-align:top;font-size:12px}th{background:#f4f7f3;color:#53645a;font-size:11px}.flag{display:inline-block;font-size:10px;font-weight:800;padding:5px 7px;border-radius:6px;background:#edf1ec;color:#51665b}.flag.ok{background:#e7f3e9;color:#276444}.flag.warn{background:#fcf0d6;color:#7d5911}.error{color:#a83e38}.hidden{display:none!important}.actions{display:flex;gap:9px;flex-wrap:wrap}.readiness{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.ready{border:1px solid #e2e7e1;border-radius:9px;padding:12px}.ready b{display:block;margin-top:5px}@media(max-width:760px){.cards,.readiness{grid-template-columns:1fr 1fr}.grid2,.fields{grid-template-columns:1fr}.wide{grid-column:auto}.lead,.checkhead{display:block}.top{padding:15px}}@media(max-width:450px){.cards,.readiness{grid-template-columns:1fr}}@media print{.top,.tabs,.noprint{display:none!important}.wrap{max-width:none;margin:0;padding:0}.panel,.checkpoint,.card{break-inside:avoid;border-color:#d4dbd4}@page{size:A4 portrait;margin:14mm}}
</style></head><body>
<header class="top"><div><b>HP</b><small>Hospitality Performance · Évaluation du cycle</small></div><a id="back" href="dashboard.html">Retour au Dashboard</a></header>
<main class="wrap"><div id="app" class="muted">Chargement de l’évaluation…</div></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.116.0';
const sb=createClient('https://wztiaiwjprarpdzsudpx.supabase.co','sb_publishable_JqSGi4QEil2MBaI5tYsQvA_wQnxz8U_');
const app=document.getElementById('app'),q=new URLSearchParams(location.search);let proposalId=q.get('proposal')||'',proposal=null,review=null,checks=[],closure=null,steps=[],tracked=[],metrics=[],score=null,lifecycle=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=v=>v?new Date(v+'T12:00:00').toLocaleDateString('fr-FR'):'—';const num=v=>v===null||v===undefined||v===''?'—':Number(v).toLocaleString('fr-FR',{maximumFractionDigits:2});const unit=v=>v==='EUR_HT'?'€ HT':v==='EUR'?'€':v||'';const plus=(s,d)=>{if(!s)return'';const x=new Date(s+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+d);return x.toISOString().slice(0,10)};
function action(s){return tracked.find(x=>x.proposal_item_id===s.proposal_item_id&&x.step_order===s.step_order)||{status:'À faire'}}
function checkpoint(day){return checks.find(x=>x.checkpoint_day===day)||{checkpoint_day:day,status:'Prévu',planned_date:'',observed_date:'',objective:'',observation:'',evidence_reference:'',next_decision:''}}
function defaultTab(){const h=location.hash.replace('#','');if(['bilan','suivi-post','cloture'].includes(h))return h;if(closure&&closure.decision&&closure.decision!=='Brouillon')return'cloture';if(review?.assessment_status==='Validé')return(checks.filter(x=>x.status==='Réalisé').length>=3?'cloture':'suivi-post');return'bilan'}
function openTab(name){document.querySelectorAll('[data-pane]').forEach(x=>x.classList.toggle('hidden',x.dataset.pane!==name));document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));history.replaceState(null,'',location.pathname+location.search+'#'+name)}
function render(){const total=steps.length,done=steps.filter(s=>action(s).status==='Terminé').length,ongoing=steps.filter(s=>action(s).status==='En cours').length,blocked=steps.filter(s=>action(s).status==='Bloqué').length,checkDone=checks.filter(x=>x.status==='Réalisé').length;const reviewData=review||{},close=closure||{};app.className='';app.innerHTML=`<section class="lead"><div><span class="tag">Cycle d’intervention</span><h1>${esc(proposal.establishment_name)}</h1><p>${esc(proposal.proposal_name)} · ${esc(proposal.status)}</p><div class="actions noprint"><a class="btn secondary" href="suivi.html?proposal=${encodeURIComponent(proposalId)}">Suivi des missions</a><a class="btn secondary" href="consultant.html?proposal=${encodeURIComponent(proposalId)}">Mission consultant</a></div></div><span class="tag">${esc(lifecycle?.current_stage||'Évaluation')}</span></section>
<div class="tabs noprint"><button class="tab" data-tab="bilan">1. Bilan</button><button class="tab" data-tab="suivi-post">2. J+30 / J+60 / J+90</button><button class="tab" data-tab="cloture">3. Clôture & réévaluation</button></div><div id="automationBox" class="automationBox"><b>Automatisations HP</b><div class="muted">Chargement du journal…</div></div><div id="consultantSummaryBox" class="automationBox"><b>Synthèse consultant automatique</b><div class="muted">Chargement…</div></div>
<section class="cards"><article class="card"><small>Actions prévues</small><strong>${total}</strong></article><article class="card"><small>Terminées</small><strong>${done}</strong></article><article class="card"><small>Contrôles réalisés</small><strong>${checkDone}/3</strong></article><article class="card"><small>Décision finale</small><strong style="font-size:16px">${esc(close.decision||'—')}</strong></article></section>
<section data-pane="bilan"><div class="panel"><h2>Bilan d’intervention</h2><div class="notice">Le bilan décrit ce qui a été constaté et documenté. Une variation de KPI n’est jamais attribuée automatiquement à HP.</div><div class="fields"><div class="field"><label>Date du bilan</label><input id="reviewDate" type="date" value="${esc(reviewData.review_date||'')}"></div><div class="field"><label>État</label><select id="reviewStatus">${['Brouillon','À compléter','Validé'].map(s=>`<option ${reviewData.assessment_status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Résultats et réalisations constatés</label><textarea id="achievements">${esc(reviewData.achievements||'')}</textarea></div><div class="field"><label>Difficultés et écarts</label><textarea id="difficulties">${esc(reviewData.difficulties||'')}</textarea></div><div class="field"><label>Facteurs externes / limites</label><textarea id="external">${esc(reviewData.external_factors||'')}</textarea></div><div class="field"><label>Prochaines actions</label><textarea id="nextSteps">${esc(reviewData.next_steps||'')}</textarea></div><div class="field wide"><label>Conclusion du consultant</label><textarea id="conclusion">${esc(reviewData.consultant_conclusion||'')}</textarea></div></div><div class="footer"><span id="reviewMsg" class="muted">${reviewData.updated_at?'Dernier enregistrement : '+new Date(reviewData.updated_at).toLocaleString('fr-FR'):'Aucun bilan enregistré'}</span><button class="btn noprint" id="saveReview">Enregistrer le bilan</button></div></div>
<div class="panel"><h2>Indicateurs avant / après</h2><div class="tablewrap"><table><thead><tr><th>Indicateur</th><th>Référence</th><th>Dernière mesure</th><th>Lecture</th></tr></thead><tbody>${metrics.map(m=>{const same=m.baseline_snapshot_id&&m.latest_snapshot_id&&m.baseline_snapshot_id===m.latest_snapshot_id;const usable=m.baseline_value!==null&&m.latest_value!==null&&!same&&m.comparable;const label=m.baseline_value===null||m.latest_value===null?'Mesure manquante':same?'Même relevé initial/final':!m.comparable?'Comparaison à contrôler':'Comparaison disponible';return`<tr><td><b>${esc(m.metric_label)}</b></td><td>${num(m.baseline_value)} ${esc(unit(m.unit))}</td><td>${num(m.latest_value)} ${esc(unit(m.unit))}</td><td><span class="flag ${usable?'ok':'warn'}">${esc(label)}</span></td></tr>`}).join('')||'<tr><td colspan="4">Aucune mesure économique disponible.</td></tr>'}</tbody></table></div>${score?`<div class="notice ${score.comparison_status==='Comparaison disponible'?'ok':''}">Score HP : ${num(score.baseline_hp_score)}/100 → ${num(score.latest_hp_score)}/100. ${esc(score.comparison_status||'')}</div>`:''}</div></section>
<section data-pane="suivi-post" class="hidden"><div class="panel"><h2>Suivi post-intervention</h2><p class="muted">Les échéances sont proposées à partir de la date du bilan. Un bilan validé initialise automatiquement J+30, J+60 et J+90 en base.</p>${[30,60,90].map(day=>{const x=checkpoint(day),planned=x.planned_date||plus(review?.review_date,day);return`<article class="checkpoint" data-day="${day}"><div class="checkhead"><div><h3>J+${day} · ${day===30?'Mise en œuvre':day===60?'Stabilisation':'Pérennisation'}</h3><div class="muted">Vérification de la continuité des pratiques et des résultats documentés.</div></div><span class="tag">${esc(x.status)}</span></div><div class="fields"><div class="field"><label>Échéance</label><input data-f="planned_date" type="date" value="${esc(planned)}"></div><div class="field"><label>Date du constat</label><input data-f="observed_date" type="date" value="${esc(x.observed_date||'')}"></div><div class="field"><label>État</label><select data-f="status">${['Prévu','En cours','Réalisé','Reporté'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Objectif du contrôle</label><input data-f="objective" value="${esc(x.objective||'')}"></div><div class="field wide"><label>Constats factuels</label><textarea data-f="observation">${esc(x.observation||'')}</textarea></div><div class="field"><label>Preuve / référence</label><textarea data-f="evidence_reference">${esc(x.evidence_reference||'')}</textarea></div><div class="field"><label>Décision / prochaine action</label><textarea data-f="next_decision">${esc(x.next_decision||'')}</textarea></div></div><div class="footer"><span data-msg class="muted">${x.updated_at?'Mis à jour : '+new Date(x.updated_at).toLocaleString('fr-FR'):'Contrôle non enregistré'}</span><button class="btn noprint" data-save>Enregistrer J+${day}</button></div></article>`}).join('')}</div></section>
<section data-pane="cloture" class="hidden"><div class="panel"><h2>Clôture & réévaluation</h2><div class="readiness"><div class="ready"><small>Bilan</small><b>${review?.assessment_status||'Absent'}</b></div><div class="ready"><small>Contrôles</small><b>${checkDone}/3</b></div><div class="ready"><small>Actions ouvertes</small><b>${total-done}</b></div><div class="ready"><small>Comparatif HP</small><b>${score?.comparison_status||'Absent'}</b></div></div><div class="notice ${review?.assessment_status==='Validé'&&checkDone===3?'ok':''}">La préparation à la clôture est informative. Le consultant peut clôturer ou prolonger avec justification lorsque certains éléments restent incomplets.</div><div class="fields"><div class="field"><label>Date de clôture</label><input id="closureDate" type="date" value="${esc(close.closure_date||'')}"></div><div class="field"><label>Décision</label><select id="closureDecision">${['Brouillon','Sous observation','Clôturé','Prolongation ciblée','Nouveau diagnostic'].map(s=>`<option ${close.decision===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Résultats maintenus</label><textarea id="sustained">${esc(close.sustained_results||'')}</textarea></div><div class="field"><label>Risques / points restant ouverts</label><textarea id="risks">${esc(close.remaining_risks||'')}</textarea></div><div class="field"><label>Enseignements de la mission</label><textarea id="lessons">${esc(close.lessons_learned||'')}</textarea></div><div class="field"><label>Suivi recommandé</label><textarea id="followup">${esc(close.recommended_follow_up||'')}</textarea></div><div class="field"><label>Prochaine revue éventuelle</label><input id="nextReview" type="date" value="${esc(close.next_review_date||'')}"></div><div class="field wide"><label>Conclusion de clôture</label><textarea id="closureConclusion">${esc(close.closure_conclusion||'')}</textarea></div></div><div class="footer"><span id="closureMsg" class="muted">${close.updated_at?'Dernier enregistrement : '+new Date(close.updated_at).toLocaleString('fr-FR'):'Aucune clôture enregistrée'}</span><div class="actions noprint"><button class="btn secondary" onclick="window.print()">Imprimer</button><button class="btn" id="saveClosure">Enregistrer la clôture</button></div></div></div></section>`;
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>openTab(b.dataset.tab));document.getElementById('saveReview').onclick=saveReview;document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveCheckpoint(b.closest('.checkpoint')));document.getElementById('saveClosure').onclick=saveClosure;openTab(defaultTab())}
async function saveReview(){const msg=document.getElementById('reviewMsg'),get=id=>document.getElementById(id).value.trim();const payload={proposal_id:proposalId,review_date:get('reviewDate')||null,assessment_status:get('reviewStatus'),achievements:get('achievements'),difficulties:get('difficulties'),external_factors:get('external'),next_steps:get('nextSteps'),consultant_conclusion:get('conclusion'),updated_at:new Date().toISOString()};if(payload.assessment_status==='Validé'&&(!payload.review_date||!payload.consultant_conclusion)){msg.textContent='Pour valider : renseigner une date et une conclusion.';msg.className='error';return}const {data,error}=await sb.from('hp_intervention_reviews').upsert(payload,{onConflict:'proposal_id'}).select('*').single();if(error){msg.textContent='Erreur : '+error.message;msg.className='error';return}review=data;msg.className='muted';msg.textContent='Enregistré · '+new Date(data.updated_at).toLocaleString('fr-FR');await refreshChecks()}
async function refreshChecks(){const {data,error}=await sb.from('hp_post_intervention_checkpoints').select('*').eq('proposal_id',proposalId);if(!error){checks=data||[];render()}}
async function saveCheckpoint(node){const day=Number(node.dataset.day),get=f=>node.querySelector(`[data-f="${f}"]`).value.trim(),msg=node.querySelector('[data-msg]');const payload={proposal_id:proposalId,checkpoint_day:day,planned_date:get('planned_date')||null,observed_date:get('observed_date')||null,status:get('status'),objective:get('objective'),observation:get('observation'),evidence_reference:get('evidence_reference'),next_decision:get('next_decision'),updated_at:new Date().toISOString()};if(payload.status==='Réalisé'&&(!payload.observed_date||!payload.observation)){msg.textContent='Pour marquer Réalisé : date du constat et observation obligatoires.';msg.className='error';return}const {data,error}=await sb.from('hp_post_intervention_checkpoints').upsert(payload,{onConflict:'proposal_id,checkpoint_day'}).select('*').single();if(error){msg.textContent='Erreur : '+error.message;msg.className='error';return}checks=checks.filter(x=>x.checkpoint_day!==day).concat(data);render();openTab('suivi-post')}
async function saveClosure(){const msg=document.getElementById('closureMsg'),get=id=>document.getElementById(id).value.trim();const payload={proposal_id:proposalId,closure_date:get('closureDate')||null,decision:get('closureDecision'),sustained_results:get('sustained'),remaining_risks:get('risks'),lessons_learned:get('lessons'),recommended_follow_up:get('followup'),next_review_date:get('nextReview')||null,closure_conclusion:get('closureConclusion'),updated_at:new Date().toISOString()};if(payload.decision!=='Brouillon'&&(!payload.closure_date||!payload.closure_conclusion)){msg.textContent='Pour enregistrer une décision finale : date et conclusion obligatoires.';msg.className='error';return}const {data,error}=await sb.from('hp_intervention_closures').upsert(payload,{onConflict:'proposal_id'}).select('*').single();if(error){msg.textContent='Erreur : '+error.message;msg.className='error';return}closure=data;render();openTab('cloture')}
async function chooser(){const {data,error}=await sb.from('hp_proposals').select('id,proposal_name,status,created_at').order('created_at',{ascending:false}).limit(100);if(error)throw error;app.innerHTML=`<section class="panel"><h1>Choisir un accompagnement</h1><div class="field"><label>Proposition</label><select id="choice"><option value="">Sélectionner…</option>${(data||[]).map(x=>`<option value="${esc(x.id)}">${esc(x.proposal_name)} · ${esc(x.status)} · ${new Date(x.created_at).toLocaleDateString('fr-FR')}</option>`).join('')}</select></div><button class="btn" id="open">Ouvrir</button></section>`;document.getElementById('open').onclick=()=>{const id=document.getElementById('choice').value;if(id)location.href='evaluation.html?proposal='+encodeURIComponent(id)}}

function renderAutomationLog(rows){
  const box=document.getElementById('automationBox'); if(!box)return;
  const list=rows||[];
  box.innerHTML=`<b>Automatisations HP</b><div class="muted">Snapshots et événements déclenchés automatiquement. Une erreur n'empêche jamais la saisie consultant.</div>${list.length?list.map(x=>`<div class="automationEvent"><span class="${x.event_status==='Réussi'?'autoOk':'autoWarn'}">${esc(x.event_status)}</span><div><b>${esc(x.event_type)}</b><div class="muted">${esc(x.message||'')}</div></div><span class="muted">${x.updated_at?new Date(x.updated_at).toLocaleString('fr-FR'):''}</span></div>`).join(''):'<div class="muted" style="margin-top:10px">Aucun événement automatique enregistré pour cette proposition.</div>'}`;
}


function renderConsultantSummary(x){
 const box=document.getElementById('consultantSummaryBox');if(!box)return;
 if(!x){box.innerHTML='<b>Synthèse consultant automatique</b><div class="muted">Synthèse indisponible.</div>';return}
 const metrics=Array.isArray(x.comparable_metrics)?x.comparable_metrics:[];
 box.innerHTML=`<b>Synthèse consultant automatique</b><div class="muted">${esc(x.synthesis_status||'')}</div>
 <div class="readiness" style="margin-top:10px">
   <div class="ready"><span class="muted">Actions terminées</span><b>${x.completed_steps||0}/${x.total_steps||0}</b></div>
   <div class="ready"><span class="muted">Preuves référencées</span><b>${x.evidenced_steps||0}</b></div>
   <div class="ready"><span class="muted">KPI comparables</span><b>${x.comparable_metric_count||0}</b></div>
   <div class="ready"><span class="muted">Évolution score HP</span><b>${x.hp_score_delta_points==null?'—':(Number(x.hp_score_delta_points)>=0?'+':'')+Number(x.hp_score_delta_points)}</b></div>
 </div>
 ${metrics.length?`<div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Indicateur</th><th>Référence</th><th>Dernière mesure</th><th>Écart</th></tr></thead><tbody>${metrics.slice(0,8).map(m=>`<tr><td>${esc(m.metric)}</td><td>${m.baseline??'—'}</td><td>${m.latest??'—'}</td><td>${m.delta??'—'}</td></tr>`).join('')}</tbody></table></div>`:''}`;
}

async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){app.innerHTML='<section class="panel error">Connexion requise.</section>';return}if(!proposalId){await chooser();return}const [p,h,r,c,plan,items,cl]=await Promise.all([sb.from('hp_proposals').select('id,diagnostic_id,proposal_name,status').eq('id',proposalId).single(),sb.from('hp_consultant_mission_v1').select('establishment_name').eq('proposal_id',proposalId).limit(1),sb.from('hp_intervention_reviews').select('*').eq('proposal_id',proposalId).maybeSingle(),sb.from('hp_post_intervention_checkpoints').select('*').eq('proposal_id',proposalId),sb.from('hp_proposal_action_plan_v1').select('*').eq('proposal_id',proposalId).order('step_order'),sb.from('hp_proposal_items').select('id').eq('proposal_id',proposalId),sb.from('hp_intervention_closures').select('*').eq('proposal_id',proposalId).maybeSingle()]);for(const x of[p,h,r,c,plan,items,cl])if(x.error)throw x.error;proposal={...p.data,establishment_name:h.data?.[0]?.establishment_name||'Établissement'};review=r.data||null;checks=c.data||[];steps=plan.data||[];closure=cl.data||null;const ids=(items.data||[]).map(x=>x.id);const [t,m,s,a,l,cs]=await Promise.all([ids.length?sb.from('hp_mission_step_tracking').select('*').in('proposal_item_id',ids):Promise.resolve({data:[],error:null}),sb.from('hp_economic_impact_v1').select('*').eq('diagnostic_id',proposal.diagnostic_id),sb.from('hp_score_impact_v1').select('*').eq('diagnostic_id',proposal.diagnostic_id).maybeSingle(),sb.from('hp_automation_log').select('*').eq('proposal_id',proposalId).order('updated_at',{ascending:false}).limit(8),sb.from('hp_lifecycle_status_v1').select('*').eq('diagnostic_id',proposal.diagnostic_id).maybeSingle(),sb.from('hp_consultant_summary_v1').select('*').eq('diagnostic_id',proposal.diagnostic_id).maybeSingle()]);for(const x of[t,m,s,a,l,cs])if(x.error)throw x.error;tracked=t.data||[];metrics=m.data||[];score=s.data||null;lifecycle=l.data||null;document.getElementById('back').href='dashboard.html?diagnostic='+encodeURIComponent(proposal.diagnostic_id);render();renderAutomationLog(a.data||[]);renderConsultantSummary(cs?.data||null)}
load().catch(e=>{console.error(e);app.innerHTML='<section class="panel error">Chargement impossible : '+esc(e.message)+'</section>'});
